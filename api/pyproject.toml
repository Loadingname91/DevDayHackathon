[project]
name = "quilt-api"
version = "0.1.0"
description = "Quilt API: command service, formulas, sync and the Clair loop (spec/backend.md)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "python-dateutil>=2.9",
  "anthropic>=2.11.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["integration: needs the live database (DATABASE_URL)"]
