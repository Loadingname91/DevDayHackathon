<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F4EEE1"><meta name="color-scheme" content="light dark">
<title>Quilt Flows Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: a flow bench. Scenario switcher on top; a live phone (or laptop) on the left; the decisions it demonstrates on the right. Phone and laptop are the Workbench world, light only; page chrome follows the viewer's theme. */
:root{
  --bg:#EFEEEA; --panel:#FFFFFF; --ink:#1E1F23; --muted:#565A61; --line:#D7D6D0; --accent:#3557A6; --accent-ink:#FFFFFF; --soft:#E7ECF7;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-data:"DM Mono",ui-monospace,Menlo,monospace;
  --muslin:#F4EEE1; --surface:#FFFDF8; --w-ink:#2A2119; --w-ink2:#665847; --stitch:#BFAE90; --denim:#3557A6; --denim-ink:#22396F; --thread:#E3A72F; --moss:#1F6B5E; --wash:#EEE6D6;
  --ease:cubic-bezier(.16,1,.3,1); --ease-thread:cubic-bezier(.45,0,.15,1);
  --t-fb:120ms; --t-state:220ms; --t-layout:350ms; --t-focal:600ms;
  --t-state-out:140ms; --t-layout-out:220ms; --t-focal-out:360ms;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141518;--panel:#1C1E22;--ink:#ECEBE6;--muted:#A5A9B0;--line:#2F3238;--accent:#93ABEA;--accent-ink:#111318;--soft:#232A3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141518;--panel:#1C1E22;--ink:#ECEBE6;--muted:#A5A9B0;--line:#2F3238;--accent:#93ABEA;--accent-ink:#111318;--soft:#232A3A;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
button,a,[role="button"]{touch-action:manipulation}
input,textarea,select{font-size:16px}
.pb,.qp,.chip,.grip,.swrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-block:32px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5vw,56px);letter-spacing:-.035em;line-height:.98;margin:0;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--muted);max-width:72ch}
.controls{display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:transparent;min-height:44px;padding:0 13px;border-radius:9px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sub{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sub .lbl{font-family:var(--f-data);font-size:12px;color:var(--muted);margin-right:6px}
.sub button{border:1px solid var(--line);background:transparent;min-height:44px;padding:0 11px;border-radius:8px;font-size:13px}
.sub button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}
.stage{display:grid;grid-template-columns:376px minmax(0,1fr);gap:32px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.notes{display:flex;flex-direction:column;gap:14px;min-width:0;color:var(--ink)}
.notes h2{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.025em;margin:0;line-height:1.05}
.notes p{margin:0;max-width:64ch}
.beats{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.beats li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:14.5px}
.beats .n{font-family:var(--f-data);font-size:12px;color:var(--muted);padding-top:2px}
.beats li.now{background:var(--soft)}
.beats b{font-weight:600}
.dec{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.try{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.try b{font-weight:600}

/* ---------- phone (Workbench) ---------- */
.phone{width:360px;max-width:100%;height:760px;border-radius:40px;border:8px solid #111216;overflow:hidden;position:relative;background:var(--muslin);color:var(--w-ink);font-family:var(--f-body);box-shadow:0 20px 44px -22px rgba(0,0,0,.4);isolation:isolate}
.screen{position:absolute;inset:0 0 96px 0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.screen:not(.full){-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent)}
.screen.full{bottom:0}
.screen::-webkit-scrollbar{display:none}
.content{position:relative;padding:40px 16px 32px;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:12px;min-height:100%}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.back,.ib{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;border-radius:12px;color:var(--w-ink);flex:none}
.back{margin-left:-12px}
@media (hover:hover) and (pointer:fine){.ib:hover,.back:hover{background:rgba(42,33,25,.06)}}
.h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.025em;line-height:1.05}
.h1.s24{font-size:24px;letter-spacing:-.015em}
.h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.015em}
.h2:focus{outline:none}
.subt{margin:0;font-size:13.5px;color:var(--w-ink2)}
.mono{font-family:var(--f-data);font-size:13px;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--w-ink2)}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;font:600 13px/1.4 var(--f-body);letter-spacing:0;color:var(--w-ink2)}
.lk{font:600 15px var(--f-body);color:var(--denim-ink);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0}
.st{--d:7px;--sc:var(--stitch);position:relative;background-color:var(--surface);border-radius:16px;
  background-image:linear-gradient(90deg,var(--sc) 58%,transparent 0),linear-gradient(90deg,var(--sc) 58%,transparent 0),linear-gradient(0deg,var(--sc) 58%,transparent 0),linear-gradient(0deg,var(--sc) 58%,transparent 0);
  background-size:var(--d) 1.5px,var(--d) 1.5px,1.5px var(--d),1.5px var(--d);
  background-position:0 5px,0 calc(100% - 5px),5px 0,calc(100% - 5px) 0;background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;transition:background-size var(--t-state) var(--ease)}
.st.basted{--d:20px;--sc:var(--w-ink2);transition-duration:var(--t-state-out)}
.card{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.b{min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--denim);color:#FFF;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.b:disabled{opacity:.55}
.b,.chip,.pat,.ib,.back,.lk{transition:transform var(--t-fb) var(--ease)}
.b:active,.chip:active,.pat:active,.ib:active,.back:active,.lk:active{transform:scale(.97)}
.b.ghost{background:transparent;color:var(--w-ink);box-shadow:inset 0 0 0 1.5px var(--stitch)}
.b.ink{background:transparent;color:var(--w-ink);box-shadow:inset 0 0 0 1.5px var(--w-ink)}
.b.wide{width:100%}
.chip{min-height:44px;padding:0 12px;border-radius:12px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--stitch);font-size:13px;color:var(--w-ink);display:inline-flex;align-items:center;gap:8px;flex:none}
.chip[aria-pressed="true"]{background:#E6ECF7;box-shadow:inset 0 0 0 1.5px var(--denim);color:var(--denim-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.chips>*{scroll-snap-align:start}
.tag{font:500 13px/1.3 var(--f-body);padding:2px 8px;background:var(--thread);color:#1F180D;border-radius:4px;white-space:nowrap}
.ex{font-size:13px;color:var(--w-ink2);padding:1px 6px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--stitch);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(42,33,25,.4);display:inline-block;flex:none}
.rows{display:flex;flex-direction:column}
.rowi{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;font-size:16px}
.rowi + .rowi{background:linear-gradient(90deg,var(--stitch) 58%,transparent 0) 0 0/8px 1px repeat-x}
.rowi .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rowi .t span:first-child{font-weight:500;color:var(--w-ink)}
.rowi .t span:last-child{font-size:13px;color:var(--w-ink2)}
.bar{height:8px;border-radius:4px;background:var(--wash);position:relative;overflow:hidden}
.bar u{position:absolute;inset:0 auto 0 0;background:var(--moss);border-radius:4px}
.bar s{position:absolute;inset:0 0 0 auto;background:repeating-linear-gradient(45deg,var(--w-ink) 0 1.3px,transparent 1.3px 4px),repeating-linear-gradient(-45deg,var(--w-ink) 0 1.3px,transparent 1.3px 4px)}
.big{font-family:var(--f-display);font-weight:800;font-size:36px;letter-spacing:-.025em;line-height:1;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-family:var(--f-data);font-size:13px;text-align:center;color:var(--w-ink2)}
.week span{padding:8px 0;border-radius:8px;background:#F3ECDD;display:flex;flex-direction:column;gap:2px;align-items:center}
.week span.r{background:var(--denim);color:#FFF}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--w-ink2)}
.field input,.field select,.field textarea{min-height:44px;border:0;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--stitch);padding:0 12px;font:inherit;font-size:16px;color:var(--w-ink)}
.field textarea{padding:12px;resize:none;line-height:1.45}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;box-shadow:inset 0 0 0 2px var(--denim)}
.clair{display:flex;gap:8px;align-items:center;font:500 15px/1.35 var(--f-body);color:var(--denim-ink);min-height:30px}
.chalk{position:relative;padding:12px 16px;border-radius:16px;background:rgba(53,87,166,.06);color:var(--denim-ink);display:flex;flex-direction:column;gap:8px}
.chalk>svg.ol,.piece>svg.ol{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.chalk>svg.ol rect,.piece>svg.ol rect{fill:none;stroke:var(--denim);stroke-opacity:.7;stroke-width:2.2;stroke-dasharray:1 6;stroke-linecap:round}
.say{margin:0;font-size:15px;font-weight:500;line-height:1.45}
.qmark{width:18px;height:18px;flex:none}
.kind{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--w-ink2)}
.piece{position:relative;padding:12px;display:flex;flex-direction:column;gap:8px}
.patchi{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none;position:relative}
.dock{position:absolute;left:12px;right:12px;bottom:max(18px,env(safe-area-inset-bottom,0px));height:62px;z-index:6;display:flex;border-radius:16px;box-shadow:0 8px 22px -14px rgba(42,33,25,.55)}
.dock .pb{flex:1;min-width:0;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;position:relative;color:var(--w-ink);transition:box-shadow var(--t-fb) var(--ease)}
.dock .pb:first-child{border-radius:16px 0 0 16px}
.dock .pb + .pb::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1.5px;background:linear-gradient(0deg,rgba(42,33,25,.45) 58%,transparent 0) 0 0/1.5px 7px repeat-y}
.dock .pb span{max-width:100%;padding:0 2px;white-space:nowrap;font:600 12px/1.2 var(--f-body);letter-spacing:.01em}  /* 13px clipped in the 344px prototype frame: spec fallback */
.dock .pb:active{box-shadow:inset 0 0 0 100px rgba(42,33,25,.07)}
.dock .pb.on{box-shadow:inset 0 -3px 0 var(--denim)}
.dock .pb.on:active{box-shadow:inset 0 -3px 0 var(--denim),inset 0 0 0 100px rgba(42,33,25,.07)}
.dock .pb.clairb{flex:0 0 64px;background:var(--w-ink);color:#FBF6EC;border-radius:0 16px 16px 0;overflow:hidden;touch-action:none}
.dock .pb.clairb::before{display:none}
.dock .pb.clairb::after{content:"";position:absolute;inset:0;background:rgba(251,246,236,.22);clip-path:inset(0 100% 0 0);pointer-events:none}
.dock .pb.clairb.holding::after{clip-path:inset(0);transition:clip-path 330ms linear 120ms}
.dock .pb.clairb:active{box-shadow:inset 0 0 0 100px rgba(251,246,236,.08)}
.toast{position:absolute;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--w-ink);color:#FBF6EC;border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.35;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity var(--t-state-out) var(--ease),transform var(--t-state-out) var(--ease)}
.toast.on{opacity:1;transform:none;pointer-events:auto;transition-duration:var(--t-state)}
.toast button{margin-left:auto;flex:none;min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid rgba(251,246,236,.5);background:transparent;color:#FBF6EC;font-weight:600;font-size:13px}
.scrim{position:absolute;inset:0;background:rgba(42,33,25,.32);z-index:10;opacity:0;visibility:hidden;touch-action:none;transition:opacity var(--t-layout-out) var(--ease),visibility 0s linear var(--t-layout-out)}
.scrim.on{opacity:1;visibility:visible;transition:opacity var(--t-layout) var(--ease),visibility 0s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;background:var(--muslin);border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:82%;overflow-y:auto;overscroll-behavior:contain;visibility:hidden;transform:translateY(105%);transition:transform var(--t-layout-out) var(--ease),visibility 0s linear var(--t-layout-out);box-shadow:0 -10px 30px -18px rgba(42,33,25,.6)}
.sheet.on{transform:none;visibility:visible;transition:transform var(--t-layout) var(--ease),visibility 0s}
.sheet .sc{display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--stitch);margin:4px auto;position:relative;flex:none}
.grab::before{content:"";position:absolute;left:-40px;right:-40px;top:-20px;bottom:-20px}
.pager{display:flex;align-items:center;gap:8px}
.dots{display:flex;gap:4px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--stitch)}
.dots i.on{background:var(--w-ink)}
.toggle{width:52px;height:44px;border:0;padding:0;background:transparent;position:relative;flex:none}
.toggle::before{content:"";position:absolute;left:0;right:0;top:6px;height:32px;border-radius:16px;background:var(--stitch);transition:background-color var(--t-state) var(--ease)}
.toggle::after{content:"";position:absolute;left:3px;top:9px;width:26px;height:26px;border-radius:50%;background:#FFF;transition:transform var(--t-state) var(--ease)}
.toggle[aria-checked="true"]::before{background:var(--denim)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.tgwrap{min-width:52px;min-height:44px;display:grid;place-items:center}
.swrow{position:relative;overflow:hidden;touch-action:pan-y}
.swrow .act{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:600;font-size:13px;transition:background-color var(--t-fb) var(--ease)}
.swrow .act .l{color:var(--moss);display:flex;gap:8px;align-items:center}
.swrow .act .r{color:var(--w-ink);display:flex;gap:8px;align-items:center}
.swrow .act .l,.swrow .act .r{transition:opacity var(--t-fb) var(--ease),color var(--t-fb) var(--ease)}
.swrow.dir-r .act .r,.swrow.dir-l .act .l{opacity:0}
.swrow.armed.dir-r .act{background-color:var(--moss)}
.swrow.armed.dir-r .act .l{color:#FFF}
.swrow.armed.dir-l .act{background-color:var(--w-ink)}
.swrow.armed.dir-l .act .r{color:#FBF6EC}
.swrow .fg{position:relative;background-color:var(--surface);touch-action:pan-y;transition:background-color var(--t-fb) var(--ease)}
.swrow .fg:active{background-color:#F7F1E6}
.swrow.sel .fg{background-color:#E6ECF7}
.ck{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--w-ink2);display:grid;place-items:center;flex:none;transition:background-color var(--t-fb) var(--ease)}
.ck.on{background-color:var(--moss);box-shadow:none;color:#FFF}
.radio{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--stitch);cursor:pointer}
.radio input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--denim);flex:none}
.radio:has(input:checked){box-shadow:inset 0 0 0 2px var(--denim)}
.meter{height:10px;border-radius:4px;background:var(--wash);overflow:hidden}
.meter u{display:block;height:100%;background:var(--denim);border-radius:4px}
.grip{width:44px;height:44px;margin:-8px -6px -8px -10px;border:0;background:transparent;display:grid;place-items:center;color:var(--w-ink2);touch-action:none;cursor:grab;flex:none}
.arr .piece{transition:scale var(--t-fb) var(--ease),box-shadow var(--t-fb) var(--ease)}
.arr.sorting .piece:not(.dragging){transition:translate var(--t-state) var(--ease)}
.arr .piece.dragging{z-index:5;scale:1.02;box-shadow:0 14px 28px -14px rgba(42,33,25,.55);cursor:grabbing}
.vseg{display:inline-flex;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--stitch);overflow:hidden}
.vseg button{min-height:44px;min-width:44px;padding:0 12px;border:0;background:transparent;font-size:13px;color:var(--w-ink2)}
.vseg button[aria-pressed="true"]{background:var(--w-ink);color:#FBF6EC}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:600;font-size:13px;color:var(--w-ink2);text-align:left;padding:4px 8px}
.tbl td{padding:8px;border-top:1px solid var(--wash)}
.tbl td:last-child,.tbl th:last-child{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums}
.pull{display:flex;justify-content:center;margin:-38px 0 -6px}
.pull button{border:0;background:transparent;min-height:44px;padding:0 12px;font-size:13px;color:var(--w-ink2);display:flex;align-items:center;gap:8px;transition:color var(--t-fb) var(--ease)}
.pull.armed button{color:var(--w-ink)}
#pv{-webkit-user-select:none;user-select:none}
.answer{padding:12px 16px;border-radius:16px;background:rgba(53,87,166,.06);color:var(--denim-ink);display:flex;flex-direction:column;gap:8px;position:relative}
.notch{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:4px;background:var(--thread);box-shadow:0 0 0 2px var(--surface)}
.dock .pb .notch{top:6px;right:8px;box-shadow:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* N1 rise from the button: grows out of the Clair cell (bottom right), same rule as quilt-home */
.sheet.clairs{left:12px;right:12px;bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 70px);border-radius:22px;padding-bottom:16px;max-height:calc(100% - 150px);transform-origin:100% 100%;transform:translateY(16px) scale(.96);opacity:0;transition:transform var(--t-layout-out) var(--ease),opacity var(--t-layout-out) var(--ease),visibility 0s linear var(--t-layout-out)}
.sheet.clairs.on{transform:none;opacity:1;transition:transform var(--t-layout) var(--ease),opacity var(--t-layout) var(--ease),visibility 0s}
.phone:has(.sheet.clairs.on) .dock{z-index:12}

  /* =========================================================

  const SUBS = [

  function pieceBody(p) {

  async function b2() {
    const c = phone(false), id = runId;

    c.innerHTML = `

    let lastFace = 'working';

    if (B.lift) { liftBrief(c, B.lift); B.lift = null; }   /* runs inside the 800ms read beat below */
    await sleep(800); if (id !== runId) return;

    for (let i = 0; i < order.length; i++) {

      el.style.opacity = 1;
      if (!RM) await el.querySelector('.ol').animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: T.layout, easing: EASE }).finished;
      if (id !== runId) return;

        $('#q').innerHTML = `<div class="chalk">${chalkOl()}<p class="say">How early should I warn you before a renewal?</p><div style="display:flex;gap:8px;flex-wrap:wrap">${['3 days before', '1 week before'].map(a => `<button type="button" class="chip" data-ans="${a}">${a}</button>`).join('')}</div></div>`;
        await new Promise(res => $$('[data-ans]').forEach(b => b.addEventListener('click', () => { B.answer = b.dataset.ans; res(); })));
        if (id !== runId) return;
        $('#q').innerHTML = `<p class="say">Warning you ${B.answer.replace(' before', '')} before each renewal.</p>`;
        face('working'); cst('Cutting 4 pieces…');
      }
      await sleep(RM ? 0 : 240); if (id !== runId) return;
      el.classList.add('st', 'basted'); el.querySelector('.ol').style.display = 'none'; el.style.background = '';
      const pb = el.querySelector('.pb'); pb.style.opacity = 1;
      if (!RM) pb.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: T.state, easing: EASE });
      cst(`Checked piece ${i + 1} of 4`);
      await sleep(RM ? 0 : 380); if (id !== runId) return;
    }
    face('waiting'); cst('Basted. I made 3 layouts for you to compare.');
    const go = document.createElement('button'); go.className = 'b wide'; go.textContent = 'See the layouts'; c.appendChild(go);

  /* N6 brief lifts into chalk: the sentence moves from the textarea into the chalk card (translate only, 350), then the outline draws. RM: crossfade 120 */
  function liftBrief(c, from) {
    const say = $('.chalk .say', c), ol = $('.chalk .ol', c), rest = $('.clair', c), to = say.getBoundingClientRect();
    if (RM) { [say, rest].forEach(e => e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: T.fb, easing: EASE })); return; }
    ol.style.clipPath = 'inset(0 100% 0 0)'; rest.style.opacity = 0;
    say.animate([{ transform: `translate(${from.x - to.left}px,${from.y - to.top}px)` }, { transform: 'none' }], { duration: T.layout, easing: EASE }).finished.then(() => {
      rest.style.opacity = ''; rest.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: T.state, easing: EASE });
      ol.style.clipPath = ''; ol.animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: T.layout, easing: EASE });
    }, () => {});
  }

  function b3() {
    const c = phone(false);
    const L = LAYOUTS[B.layout];
    if (!B.pieces.length) B.pieces = L.pieces.map(newPiece);
    c.innerHTML = `
      <div class="top"><button type="button" class="back" aria-label="Back to build">${icon('i-back', 22)}</button><b>Preview</b><span style="width:44px"></span></div>
      <div class="pager st" role="group" aria-label="Layouts" style="justify-content:space-between;padding:4px;border-radius:16px"><button type="button" class="ib" id="prevL" aria-label="Previous layout">${icon('i-back')}</button><span id="pgl" style="display:flex;flex-direction:column;align-items:center;gap:4px"></span><button type="button" class="ib" id="nextL" aria-label="Next layout">${icon('i-arrow')}</button></div>
      <div id="pv" style="display:grid;gap:12px;touch-action:pan-y"></div>
      <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:8px;position:sticky;bottom:0;padding:12px 0 4px;background:var(--muslin)"><button type="button" class="b ghost" id="arr">${icon('i-layout')}Arrange</button><button type="button" class="b" id="use">Use this layout</button></div>`;
    const pv = $('#pv');
    /* re-render only the label + #pv; the new layout enters from the side the swipe came from */
    const renderPv = from => {
      const L = LAYOUTS[B.layout];
      $('#pgl').innerHTML = `<b style="font-size:16px">${L.name}</b><span class="dots" aria-hidden="true">${LAYOUTS.map((_, i) => `<i class="${i === B.layout ? 'on' : ''}"></i>`).join('')}</span><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">${B.layout + 1} of 3</span>`;
      pv.innerHTML = `<div style="display:flex;align-items:center;gap:12px"><span class="patchi" style="background:${DYES[B.dye]}">${icon(B.ic)}</span><h2 class="h1 s24">${esc(B.name)}</h2></div>
        <p class="small" style="margin:0">Example rows · cleared when you add it, unless you keep them</p>
        ${B.pieces.map(pieceCard).join('')}`;
      pv.style.transform = pv.style.opacity = '';
      if (!RM) pv.animate([{ opacity: 0, transform: `translateX(${from * 24}px)` }, { opacity: 1, transform: 'none' }], { duration: T.state, easing: EASE });
    };
    const swap = d => { B.layout = (B.layout + d + 3) % 3; B.pieces = LAYOUTS[B.layout].pieces.map(newPiece); renderPv(d); };
    $('#prevL').addEventListener('click', () => swap(-1)); $('#nextL').addEventListener('click', () => swap(1));
    $('.back', c).addEventListener('click', () => goStep(1));
    $('#arr').addEventListener('click', () => goStep(3)); $('#use').addEventListener('click', () => goStep(4));
    /* pager: track 1:1, release on the pager rule (|dx + projected| > 30% of width) */
    let x0 = 0, y0 = 0, dx = 0, st = 'idle', w = 1, stop = null; const tr = tracker();
    const set = x => { dx = x; pv.style.transform = `translateX(${x}px)`; pv.style.opacity = String(1 - Math.min(1, Math.abs(x) / w) * .4); };
    pv.addEventListener('pointerdown', e => {
      if (e.button) return; stop && stop(); stop = null; pv.getAnimations().forEach(a => a.cancel());
      w = pv.offsetWidth; const live = new DOMMatrix(getComputedStyle(pv).transform).m41 || 0;
      x0 = e.clientX - live; y0 = e.clientY; st = live ? 'drag' : 'pending'; tr.reset(); tr.add(e.clientX);
      pv.setPointerCapture(e.pointerId);
    });
    pv.addEventListener('pointermove', e => {
      if (st === 'idle') return; const mx = e.clientX - x0, my = e.clientY - y0;
      if (st === 'pending') { if (Math.abs(mx) < 10 && Math.abs(my) < 10) return; if (Math.abs(my) > Math.abs(mx)) { st = 'idle'; return; } st = 'drag'; }
      tr.add(e.clientX); set(mx);
    });
    const release = cancel => {
      if (st !== 'drag') { st = 'idle'; return; } st = 'idle';
      const v = cancel ? 0 : tr.v();
      if (!cancel && Math.abs(dx + project(v)) > .3 * w) { swap(dx + project(v) < 0 ? 1 : -1); return; }
      stop = spring(dx, 0, v, .3, set, () => { stop = null; pv.style.transform = pv.style.opacity = ''; });
    };
    pv.addEventListener('pointerup', () => release(false));
    pv.addEventListener('pointercancel', () => release(true));
    renderPv(1);
  }

  function b4() {
    const c = phone(false);
    c.innerHTML = `
      <div class="top"><button type="button" class="back" aria-label="Back to preview">${icon('i-back', 22)}</button><b>Arrange</b><button type="button" class="lk" id="done" aria-label="Done arranging" style="padding:0 8px">Done</button></div>

      else toast('I couldn’t find a total to move. Add a metric block first.');
    });
  }
  let arrStops = [];
  function renderArr(flashId, settle) {
    const L = $('#arrList'); if (!L) return;
    arrStops.forEach(f => f()); arrStops = [];
    const first = new Map($$('.piece', L).map(el => [el.dataset.id, el.getBoundingClientRect().top]));
    L.innerHTML = B.pieces.map((p, i) => `<section class="piece st" data-id="${p.id}" aria-label="${p.name}, piece ${i + 1} of ${B.pieces.length}">
      <div style="display:flex;align-items:center;gap:8px">
        <button type="button" class="grip" aria-label="Move ${p.name}. Drag, or use arrow keys">${icon('i-grip')}</button>
        <span class="kind" style="flex:1">${qm(p.mark)}<b style="font-family:var(--f-body);font-size:16px;font-weight:500;color:var(--w-ink)">${p.name}</b></span>
        <button type="button" class="ib" data-rip="${p.id}" aria-label="Remove ${p.name}" title="Remove">${icon('i-rip')}</button>
      </div>
      ${p.k === 'list' ? `<div class="vseg" role="group" aria-label="View type for ${p.name}">${['list', 'table', 'calendar'].map(v => `<button type="button" data-view="${v}" data-pid="${p.id}" aria-pressed="${p.view === v}">${v}</button>`).join('')}</div>` : ''}
      <div style="pointer-events:none">${pieceBody(p)}</div></section>`).join('');
    $$('.piece', L).forEach(el => {
      const f = first.get(el.dataset.id); const d = f === undefined ? 0 : f - el.getBoundingClientRect().top;
      if (settle && el.dataset.id === settle.id) {
        /* dropped piece: settle from where the finger left it, carrying its speed */
        el.style.translate = `0 ${d}px`;
        arrStops.push(spring(d, 0, settle.v, .3, y => { el.style.translate = `0 ${y}px`; }, () => { el.style.translate = ''; }));
        if (!RM) el.animate([{ scale: '1.02' }, { scale: '1' }], { duration: T.fb, easing: EASE });
      } else if (!RM && Math.abs(d) > 1) el.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: T.layout, easing: EASE });

  /* talk: the waveform is a running stitch whose stitch lengths follow the voice level */
  async function clairTalk(held) {
    const run = ++cRun, N = 24;
    const s = await clairShow(`${head(spool('waiting', 44), 'Listening')}
      <svg class="stw" viewBox="0 0 300 24" preserveAspectRatio="none" aria-hidden="true">${Array.from({ length: N }, (_, i) => `<rect x="${i * 12.5 + 2.75}" y="11" width="7" height="2.2" rx="1.1"/>`).join('')}</svg>
      <p class="tr20" id="ctr" aria-live="polite"></p>
      ${held ? `<p class="small" id="chint" style="margin:0">${HINT}</p>` : `<div style="display:grid;grid-template-columns:1fr 1.6fr;gap:8px"><button type="button" class="b ghost" id="tCancel">Cancel</button><button type="button" class="b" id="tSend">Send</button></div>`}`);
    if (run !== cRun) return;
    const words = TALK.split(' '), out = $('#ctr', s), rects = $$('.stw rect', s); let i = 0;
    const wt = setInterval(() => { if (run !== cRun || i >= words.length) return clearInterval(wt); out.textContent = words.slice(0, ++i).join(' '); }, 220);
    if (!RM) {
      let ph = 0;
      const wv = setInterval(() => {
        if (run !== cRun) return clearInterval(wv); ph += .7; const speaking = i < words.length;
        rects.forEach((r, k) => { const lvl = speaking ? .3 + .7 * Math.abs(Math.sin(ph + k * .55)) * Math.random() : .15, w = 3 + lvl * 8.5; r.setAttribute('width', w.toFixed(1)); r.setAttribute('x', (k * 12.5 + (12.5 - w) / 2).toFixed(1)); });
      }, 90);
    }
    if (!held) { $('#tCancel', s).addEventListener('click', () => clairStart()); $('#tSend', s).addEventListener('click', talkSend); }
  }

  /* N2 stitches settle: on send every stitch eases back to its rest length and the hint says "Sending", then the swap. RM: hint only */
  async function talkSend() {
    const s = $('#sheet'), rects = $$('.stw rect', s); if (!rects.length) return clairResult(TALK);
    const run = ++cRun;   /* stops the waveform + transcript timers */
    const h = $('#chint', s), b = $('#tSend', s); if (h) h.textContent = 'Sending'; if (b) { b.textContent = 'Sending'; b.disabled = true; }
    if (!RM) rects.forEach((r, k) => { const w = +r.getAttribute('width'); r.setAttribute('width', 7); r.setAttribute('x', k * 12.5 + 2.75); r.animate([{ transform: `scaleX(${w / 7})` }, { transform: 'none' }], { duration: T.fb, easing: EASE }); });
    await sleep(T.fb + 40); if (run === cRun) clairResult(TALK);
  }

    const cards = CAP[text] || CAP[TALK], apps = [...new Set(cards.flatMap(c => c.apps))];
    s = await clairShow(`${head(spool('waiting', 44), 'Ready to add')}${quote}
      ${cards.map((c, k) => `<section class="st card basted cprop" data-k="${k}"><div style="display:flex;gap:12px;align-items:center;min-height:24px"><i class="dot" style="background:${DYES[c.d]}"></i><span style="font-size:16px;font-weight:500">${c.t}</span></div></section>`).join('')}

    if (run !== cRun) return;
    /* N3 proposals arrive: each destination card lands on its own, 40ms apart (cap 3); the buttons stay put. RM: opacity 120, no stagger */
    $$('.cprop', s).forEach((p, i) => p.animate(RM ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: RM ? T.fb : T.state, delay: RM ? 0 : Math.min(i, 2) * 40, easing: EASE, fill: 'backwards' }));
    $('#cEdit', s).addEventListener('click', () => clairStart(text));
    let busy = false;
    $('#cAdd', s).addEventListener('click', async e => {
      if (busy) return; busy = true; e.currentTarget.disabled = true;
      const alive = () => run === cRun;
      $$('.cprop', s).forEach(c => c.classList.remove('basted'));   /* basted → running stitch */
      await sleep(RM ? T.fb : T.state); if (!alive()) return;
      const pairs = [];
      $$('.cprop', s).forEach(el => cards[+el.dataset.k].pins.forEach(p => { const ico = $(`.dock .pb[data-pin="${p}"] .ico`); if (ico) pairs.push({ from: $('.dot', el), to: ico, top: true }); }));
      const land = to => notchPin(to.closest('.pb'));
      if (RM || !pairs.length) { pairs.forEach(p => land(p.to)); await sleep(RM ? T.fb : T.state); }
      else if (!(await threadPull(pairs, land, alive))) return;
      if (!alive()) return;
      closeSheet();
      toast(`Added to ${listJoin(apps)}.`, 'Undo', () => $$('.dock .notch').forEach(n => n.animate([{ opacity: 1 }, { opacity: 0 }], { duration: T.stateOut, easing: EASE }).onfinish = () => n.remove()));
    });
  }

  async function clairAsk(text) {
    const run = ++cRun;
    await clairShow(`${head(spool('thinking', 44), 'Looking')}<p style="margin:0;font-size:16px;color:var(--w-ink)">“${esc(text)}”</p>`);
    await sleep(RM ? T.fb : 700); if (run !== cRun) return;
    const [ans, srcs, act] = ASK[text] || ASK['Can I afford $60 concert tickets?'];
    const s = await clairShow(`${head(spool('stitched', 44, true), esc(text))}
      <section class="answer" style="color:var(--w-ink)"><p style="margin:0;font-size:16px;line-height:1.45">${ans}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${srcs.map(([d, n]) => `<button type="button" class="chip" data-from="${n}"><i class="dot" style="background:${DYES[d]}"></i>${n}</button>`).join('')}</div></section>
      <button type="button" class="b wide" id="aAct">${act}</button>
      <button type="button" class="lk" id="aBack" style="align-self:flex-start">Ask something else ›</button>`);
    if (run !== cRun) return;
    $('#aAct', s).addEventListener('click', () => { closeSheet(); toast(act.startsWith('Add') ? 'Added $60 concert tickets to Budget as planned.' : act.replace('Open', 'Opens') + '.'); });
    $$('[data-from]', s).forEach(b => b.addEventListener('click', () => { closeSheet(); toast(`Opens ${b.dataset.from}.`); }));
    $('#aBack', s).addEventListener('click', () => clairStart());
  }

  /* ---------- wiring ---------- */
  let current = 'build';
  function pick(sc) {
    current = sc; runId++;
    $$('[data-sc]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.sc === sc)));
    stage.classList.toggle('wide', sc === 'laptop');
    if (sc === 'build') { setNotes(BUILD_NOTES(), B.step); buildSub(); goStep(B.step); }
    else if (sc === 'stitched') stitched();
    else if (sc === 'search') search();
    else if (sc === 'rows') rows();
    else if (sc === 'settings') settings();
    else laptop();
  }
  $$('[data-sc]').forEach(b => b.addEventListener('click', () => pick(b.dataset.sc)));
  pick('build');
})();
</script>
