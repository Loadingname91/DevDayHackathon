<title>Quilt Dock Studies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one Home phone, four docks to swap in, an app-count control to stress each, and the trade-offs beside it. Phone = Workbench world; page chrome follows the viewer's theme. */
:root{
  --bg:#EFEEEA; --panel:#FFFFFF; --ink:#1E1F23; --muted:#565A61; --line:#D7D6D0; --accent:#3557A6; --accent-ink:#FFFFFF; --soft:#E7ECF7;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif; --f-data:"DM Mono",ui-monospace,Menlo,monospace;
  --muslin:#F4EEE1; --surface:#FFFDF8; --w-ink:#2A2119; --w-ink2:#665847; --stitch:#BFAE90; --denim:#3557A6; --thread:#E3A72F; --moss:#1F6B5E; --wash:#EEE6D6;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141518;--panel:#1C1E22;--ink:#ECEBE6;--muted:#A5A9B0;--line:#2F3238;--accent:#93ABEA;--accent-ink:#111318;--soft:#232A3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141518;--panel:#1C1E22;--ink:#ECEBE6;--muted:#A5A9B0;--line:#2F3238;--accent:#93ABEA;--accent-ink:#111318;--soft:#232A3A;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5vw,56px);letter-spacing:-.035em;line-height:.98;margin:0}
.lede{margin:8px 0 0;color:var(--muted);max-width:70ch}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:transparent;min-height:40px;padding:0 13px;border-radius:9px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbl{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.stage{display:grid;grid-template-columns:376px minmax(0,1fr);gap:32px;align-items:start}
.notes{display:flex;flex-direction:column;gap:14px;color:var(--ink);min-width:0}
.notes h2{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.025em;margin:0;line-height:1.05}
.notes p{margin:0;max-width:64ch}
.pc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pc div{border-top:2px solid var(--ink);padding-top:8px;font-size:14px}
.pc b{display:block;font-weight:700;margin-bottom:2px}
.verdict{font-family:var(--f-data);font-size:12.5px;color:var(--muted)}
.try{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px}

.phone{width:360px;max-width:100%;height:760px;border-radius:40px;border:8px solid #111216;overflow:hidden;position:relative;background:var(--muslin);color:var(--w-ink);font-family:var(--f-body);box-shadow:0 20px 44px -22px rgba(0,0,0,.4);isolation:isolate}
.screen{position:absolute;inset:0 0 100px 0;overflow-y:auto;scrollbar-width:none}
.content{padding:40px 16px 20px;display:grid;gap:12px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.ib{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;border-radius:12px;flex:none}
.h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.025em;line-height:1.05}
.small{font-size:12.5px;color:var(--w-ink2)}
.st{--d:7px;--sc:var(--stitch);background-color:var(--surface);border-radius:14px;background-image:linear-gradient(90deg,var(--sc) 58%,transparent 0),linear-gradient(90deg,var(--sc) 58%,transparent 0),linear-gradient(0deg,var(--sc) 58%,transparent 0),linear-gradient(0deg,var(--sc) 58%,transparent 0);background-size:var(--d) 1.5px,var(--d) 1.5px,1.5px var(--d),1.5px var(--d);background-position:0 5px,0 calc(100% - 5px),5px 0,calc(100% - 5px) 0;background-repeat:repeat-x,repeat-x,repeat-y,repeat-y}
.st.basted{--d:20px;--sc:var(--w-ink2)}
.card{padding:14px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.035em;line-height:1}
.bar{height:8px;border-radius:4px;background:var(--wash);overflow:hidden}.bar u{display:block;height:100%;background:var(--moss);border-radius:4px}
.b{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--denim);color:#FFF;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.toast{position:absolute;left:12px;right:12px;bottom:110px;z-index:9;background:var(--w-ink);color:#FBF6EC;border-radius:12px;padding:12px 14px;font-size:13px;opacity:0;transform:translateY(8px);transition:opacity 220ms var(--ease),transform 220ms var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:none}

/* docks */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:0 12px 18px}
/* 0 current */
.d0{height:60px;border-radius:16px;background:var(--surface);display:flex;align-items:center;gap:3px;padding:0 7px;box-shadow:0 8px 22px -14px rgba(42,33,25,.5)}
.d0 .di{width:44px;height:44px;border-radius:11px;border:0;display:grid;place-items:center;flex:none}
.d0 .sep{width:1px;height:26px;background:var(--stitch);margin:0 2px 0 auto}
/* A selvedge strip */
.dA{display:flex;align-items:stretch;gap:6px;height:76px;border-radius:18px;background:var(--surface);padding:6px;box-shadow:0 8px 22px -14px rgba(42,33,25,.5)}
.dA .strip{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-mask:linear-gradient(90deg,#000 85%,transparent);mask:linear-gradient(90deg,#000 85%,transparent)}
.dA .pa{flex:none;width:60px;border:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:600;scroll-snap-align:start;padding:0 4px}
.dA .pa span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.dA .srch{width:52px;border:0;border-radius:12px;background:var(--w-ink);color:#FBF6EC;display:grid;place-items:center;flex:none}
/* B patchwork border + unfold */
.dB .handle{display:flex;justify-content:center;margin-bottom:6px}
.dB .handle button{border:0;background:transparent;min-height:32px;padding:0 12px;display:flex;align-items:center;gap:8px;font-family:var(--f-data);font-size:11px;color:var(--w-ink2)}
.dB .handle i{width:36px;height:4px;border-radius:2px;background:var(--stitch);display:block}
.dB .row{display:flex;height:62px;border-radius:16px;overflow:hidden;box-shadow:0 8px 22px -14px rgba(42,33,25,.55),inset 0 0 0 1.5px rgba(42,33,25,.12)}
.dB .pb{flex:1;min-width:0;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;position:relative}
.dB .pb + .pb::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1.5px;background:linear-gradient(0deg,rgba(42,33,25,.45) 58%,transparent 0) 0 0/1.5px 7px repeat-y}
.dB .pb span{max-width:100%;padding:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dB .pb.srch{flex:none;width:56px;background:var(--w-ink);color:#FBF6EC}
.quiltsheet{position:absolute;inset:0;z-index:12;background:var(--muslin);transform:translateY(100%);transition:transform 420ms var(--ease);display:flex;flex-direction:column}
.quiltsheet.on{transform:none}
.quiltsheet .qhead{padding:40px 16px 8px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chip{min-height:40px;padding:0 13px;border-radius:11px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--stitch);font-size:13px;flex:none}
.chip[aria-pressed="true"]{background:#E6ECF7;box-shadow:inset 0 0 0 1.5px var(--denim)}
.qgrid{flex:1;overflow-y:auto;padding:6px 16px 24px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:58px;align-content:start;grid-auto-flow:dense;gap:0;scrollbar-width:none}
.qp{border:0;position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:9px;text-align:left;font-size:12px;font-weight:600;overflow:hidden}
.qp::after{content:"";position:absolute;inset:3px;border:1.5px dashed rgba(42,33,25,.28);border-radius:6px;pointer-events:none}
.qp{grid-column:span 2}.qp.s1{grid-column:span 4;grid-row:span 2}.qp.s2{grid-column:span 2;grid-row:span 1}.qp.s3{grid-column:span 3}
.qp.faded::before{content:"";position:absolute;inset:0;background:rgba(244,238,225,.6)}
.qp > *{position:relative}
.qp .stat{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1}
.qp .nm{display:flex;align-items:center;gap:5px;max-width:100%}
.qp .nm span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.15;font-size:11.5px}
.qp .nm{align-items:flex-start}

/* C side seam */
.seam{position:absolute;right:0;top:120px;bottom:120px;width:30px;z-index:7;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding-right:5px;touch-action:none;cursor:ns-resize}
.seam .bars{display:flex;flex-direction:column;gap:2px;width:8px;height:100%;border-radius:4px;overflow:hidden}
.seam .bars i{flex:1;display:block;min-height:3px}
.seam .bars i.on{transform:scaleX(1.8);transform-origin:right}
.bubble{position:absolute;right:42px;z-index:8;display:none;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:14px;box-shadow:0 12px 28px -12px rgba(42,33,25,.6);font-weight:700;font-size:15px;pointer-events:none}
.bubble.on{display:flex}
.dC{display:flex;justify-content:center;gap:8px}
.dC .pill{min-height:52px;border:0;border-radius:999px;background:var(--w-ink);color:#FBF6EC;display:flex;align-items:center;gap:8px;padding:0 20px;font-weight:600;font-size:14px;box-shadow:0 8px 22px -12px rgba(42,33,25,.6)}
.dC .pill.ghost{background:var(--surface);color:var(--w-ink);box-shadow:inset 0 0 0 1.5px var(--stitch)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}.phone{margin:0 auto}.pc{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.quiltsheet,.toast{transition-duration:120ms}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 4-5 7-5s5.8 1.4 7 5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-quilt" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3 7h18v12H3zM3 10h18M16 15h2"/></symbol>
  <symbol id="i-lift" viewBox="0 0 24 24"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.5h10.6L20 7H6.2M9 19.5h.01M17 19.5h.01"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 12V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 12v3a3 3 0 0 1-3 3H4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5h12v15H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v9H4zM10 20v-5h4v5"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 9h6M9 13h6M9 17h3"/></symbol>
</defs></svg>

<main class="wrap">
  <header>
    <h1>Quilt Dock Studies</h1>
    <p class="lede">The same Home screen with four ways to reach your apps. Stress each one with 6, 14 and 30 apps. The words on screen already use "app" (with "tabs" inside an app) so you can judge the terminology in context too.</p>
  </header>
  <div class="controls">
    <div class="seg" role="group" aria-label="Dock concept">
      <button type="button" data-d="0" aria-pressed="false">Current</button>
      <button type="button" data-d="A" aria-pressed="false">A · Selvedge strip</button>
      <button type="button" data-d="B" aria-pressed="true">B · Patchwork border + quilt</button>
      <button type="button" data-d="C" aria-pressed="false">C · Side seam</button>
    </div>
    <span class="lbl">apps</span>
    <div class="seg" role="group" aria-label="Number of apps">
      <button type="button" data-n="6" aria-pressed="false">6</button>
      <button type="button" data-n="14" aria-pressed="true">14</button>
      <button type="button" data-n="30" aria-pressed="false">30</button>
    </div>
  </div>
  <div class="stage">
    <div class="phone" id="phone" aria-label="Quilt Home prototype">
      <div class="screen"><div class="content" id="home"></div></div>
      <div id="dockHost"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <div class="notes" id="notes" aria-live="polite"></div>
  </div>
</main>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const icon = (id, s = 18) => `<svg class="ico" style="width:${s}px;height:${s}px" aria-hidden="true"><use href="#${id}"/></svg>`;
  const DYES = ['#FBEBC4', '#DDEBD2', '#D3ECE7', '#F8DCC2', '#DCE4F3', '#EADCF0', '#E7EBC2', '#F3DCE0'];
  const INK = 'rgba(42,33,25,';
  const PR = ['', `repeating-linear-gradient(0deg,${INK}.08) 0 4px,transparent 4px 8px),repeating-linear-gradient(90deg,${INK}.08) 0 4px,transparent 4px 8px)`, `repeating-linear-gradient(135deg,${INK}.10) 0 1.5px,transparent 1.5px 7px)`, `radial-gradient(${INK}.16) 1.2px,transparent 1.7px) 0 0/8px 8px`];
  const dye = i => `background-color:${DYES[i % 8]};${PR[Math.floor(i / 8) % 4] ? 'background-image:' + PR[Math.floor(i / 8) % 4] + ';' : ''}`;
  const ALL = [
    ['Budget', 'money', 'i-wallet', 0, '$376 left'], ['Groceries', 'money', 'i-cart', 0, '20 items'], ['Calendar', 'home', 'i-cal', 0, 'Shop 12:41'], ['To-dos', 'home', 'i-check', 0, '2 left'], ['Workout', 'body', 'i-lift', 1, 'Pull day'], ['Subscriptions', 'money', 'i-repeat', 2, '$38/mo'],
    ['Classes', 'school', 'i-book', 1, '2 due'], ['Runs', 'body', 'i-lift', 4], ['CS 3500', 'school', 'i-book', 1], ['Chores', 'home', 'i-home', 6], ['Meals', 'body', 'i-cart', 2], ['Savings jar', 'money', 'i-wallet', 9], ['Assignments', 'school', 'i-book', 0], ['Journal', 'other', 'i-note', 3],
    ['Sleep', 'body', 'i-note', 17], ['Rent split', 'money', 'i-wallet', 12], ['Reading list', 'school', 'i-book', 22], ['Plants', 'home', 'i-home', 25], ['Textbooks', 'money', 'i-wallet', 30], ['Internship apps', 'school', 'i-book', 5], ['Water', 'body', 'i-note', 19], ['Movies', 'other', 'i-note', 8], ['Laundry', 'home', 'i-home', 16], ['Recipes', 'other', 'i-note', 11],
    ['Side gig', 'money', 'i-wallet', 2], ['Climbing', 'body', 'i-lift', 15], ['Exams', 'school', 'i-book', 7], ['Packing list', 'home', 'i-home', 40], ['Birthdays', 'other', 'i-note', 21], ['Coffee count', 'money', 'i-wallet', 1]
  ].map(([n, pile, ic, days, stat], i) => ({ n, pile, ic, days, stat, i }));
  let concept = 'B', count = 14;
  const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1800); };
  const apps = () => ALL.slice(0, count);
  const recent = () => apps().slice().sort((a, b) => a.days - b.days || a.i - b.i);

  function home() {
    $('#home').innerHTML = `
      <div class="top"><span style="display:flex;gap:8px;align-items:center;font-family:var(--f-display);font-weight:800;font-size:17px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="9" height="9" rx="2" fill="#E3A72F"/><rect x="12" y="1" width="9" height="9" rx="2" fill="#5B7DB1"/><rect x="1" y="12" width="9" height="9" rx="2" fill="#8DB580"/><rect x="12" y="12" width="9" height="9" rx="2" fill="#9C6BA8"/></svg>quilt</span><button type="button" class="ib" aria-label="Profile and settings" style="background:${DYES[3]};border-radius:50%">${icon('i-user')}</button></div>
      <h2 class="h1">Morning, Sam.</h2>
      <p class="small" style="margin:0">${count} apps · 3 things to look at today</p>
      <section class="st basted card"><b>Corner Market receipt</b><span class="small">8 rows read, waiting for your OK</span><button type="button" class="b" style="align-self:flex-start">Stitch all 8</button></section>
      <section class="st card"><span class="small">Budget</span><div style="display:flex;align-items:baseline;gap:8px"><span class="big">$376</span><span class="small">left of $800</span></div><div class="bar"><u style="width:53%"></u></div></section>
      <section class="st card"><span class="small">Workout · today</span><b style="font-size:17px">Pull day at 6:00 pm</b><span class="small">5 exercises · ~45 min</span></section>
      <section class="st card"><span class="small">To-dos</span><span>Return library books</span><span>DevDay demo at 3 pm</span></section>`;
  }

  function dock() {
    const host = $('#dockHost'); const r = recent();
    $('#seamHost') && $('#seamHost').remove();
    if (concept === '0') {
      host.innerHTML = `<nav class="dock" aria-label="Apps"><div class="d0">${r.slice(0, 5).map(a => `<button type="button" class="di" aria-label="${a.n}" style="${dye(a.i)}">${icon(a.ic)}</button>`).join('')}<span class="sep" aria-hidden="true"></span><button type="button" class="di" aria-label="Search" style="background:transparent">${icon('i-search')}</button><button type="button" class="di" aria-label="All apps" style="background:transparent">${icon('i-menu')}</button></div></nav>`;
    } else if (concept === 'A') {
      host.innerHTML = `<nav class="dock" aria-label="Apps"><div class="dA"><div class="strip" role="list" aria-label="${count} apps, most recent first">${r.map(a => `<button type="button" role="listitem" class="pa" aria-label="${a.n}" style="${dye(a.i)}">${icon(a.ic)}<span>${a.n}</span></button>`).join('')}</div><button type="button" class="srch" aria-label="Search all apps">${icon('i-search')}</button></div></nav>`;
    } else if (concept === 'B') {
      host.innerHTML = `<nav class="dock dB" aria-label="Apps">
        <div class="handle"><button type="button" id="unfold" aria-expanded="false" aria-controls="quilt"><i aria-hidden="true"></i>all ${count} apps<i aria-hidden="true"></i></button></div>
        <div class="row">${r.slice(0, 4).map(a => `<button type="button" class="pb" aria-label="${a.n}" style="${dye(a.i)}">${icon(a.ic)}<span>${a.n}</span></button>`).join('')}<button type="button" class="pb srch" aria-label="Search all apps">${icon('i-search')}</button></div>
      </nav>
      <section class="quiltsheet" id="quilt" aria-label="Your quilt: all apps" aria-hidden="true">
        <div class="qhead"><div class="top"><h2 class="h1" style="font-size:24px">Your quilt</h2><button type="button" class="ib" id="fold" aria-label="Fold the quilt">${icon('i-x')}</button></div>
          <div class="chips" role="group" aria-label="Pile">${['all', 'money', 'body', 'school', 'home', 'other'].map((p, i) => `<button type="button" class="chip" data-pile="${p}" aria-pressed="${i === 0}">${p}</button>`).join('')}</div>
          <span class="small">Bigger patches are the apps you open most. Faded ones haven't been opened in 2+ weeks.</span></div>
        <div class="qgrid" id="qgrid"></div>
      </section>`;
      const drawQuilt = pile => {
        const list = recent().filter(a => pile === 'all' || a.pile === pile);
        $('#qgrid').innerHTML = list.map((a, k) => {
          const cls = k === 0 ? 's1' : k < 3 ? 's2' : k < 5 ? 's3' : '';
          return `<button type="button" class="qp ${cls}${a.days >= 14 ? ' faded' : ''}" style="${dye(a.i)}" aria-label="${a.n}${a.stat ? ', ' + a.stat : ''}"><span class="nm">${icon(a.ic, 16)}<span>${a.n}</span></span>${a.stat && (k < 3) ? `<span class="stat" style="${k === 0 ? '' : 'font-size:14px;white-space:nowrap'}">${a.stat}</span>` : ''}</button>`;
        }).join('');
        $$('.qp').forEach(b => b.addEventListener('click', () => toast(`Opens ${b.getAttribute('aria-label').split(',')[0]}`)));
      };
      const sheet = $('#quilt'), btn = $('#unfold');
      const open = () => { sheet.classList.add('on'); sheet.setAttribute('aria-hidden', 'false'); btn.setAttribute('aria-expanded', 'true'); drawQuilt('all'); setTimeout(() => $('#fold').focus(), 60); };
      const close = () => { sheet.classList.remove('on'); sheet.setAttribute('aria-hidden', 'true'); btn.setAttribute('aria-expanded', 'false'); btn.focus(); };
      btn.addEventListener('click', open); $('#fold').addEventListener('click', close);
      $$('[data-pile]').forEach(c => c.addEventListener('click', () => { $$('[data-pile]').forEach(x => x.setAttribute('aria-pressed', String(x === c))); drawQuilt(c.dataset.pile); }));
      let y0 = null; const row = $('.dB');
      row.addEventListener('pointerdown', e => { y0 = e.clientY; });
      row.addEventListener('pointerup', e => { if (y0 !== null && y0 - e.clientY > 40) open(); y0 = null; });
      let y1 = null; sheet.addEventListener('pointerdown', e => { if ($('#qgrid').scrollTop <= 0) y1 = e.clientY; });
      sheet.addEventListener('pointerup', e => { if (y1 !== null && e.clientY - y1 > 80) close(); y1 = null; });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('on')) close(); });
    } else {
      host.innerHTML = `<nav class="dock dC" aria-label="Search and apps"><button type="button" class="pill">${icon('i-search')}Search or ask</button><button type="button" class="pill ghost" aria-label="Home">${icon('i-home')}</button></nav>`;
      const s = document.createElement('div'); s.id = 'seamHost';
      s.innerHTML = `<div class="seam" id="seam" role="slider" tabindex="0" aria-label="Scrub through your ${count} apps" aria-valuemin="1" aria-valuemax="${count}" aria-valuenow="1" aria-valuetext="${r[0].n}"><div class="bars">${r.map(a => `<i style="${dye(a.i)}"></i>`).join('')}</div></div><div class="bubble" id="bubble"></div>`;
      $('#phone').appendChild(s);
      const seam = $('#seam'), bub = $('#bubble'); let idx = 0, active = false;
      const show = i => {
        idx = Math.max(0, Math.min(r.length - 1, i)); const a = r[idx];
        $$('.bars i', seam).forEach((b, k) => b.classList.toggle('on', k === idx));
        const bars = $$('.bars i', seam)[idx].getBoundingClientRect(), ph = $('#phone').getBoundingClientRect();
        bub.style.cssText = `top:${bars.top - ph.top + bars.height / 2 - 26}px;${dye(a.i)}`; bub.className = 'bubble on';
        bub.innerHTML = `${icon(a.ic, 22)}${a.n}`;
        seam.setAttribute('aria-valuenow', idx + 1); seam.setAttribute('aria-valuetext', a.n);
      };
      const at = y => { const b = $('.bars', seam).getBoundingClientRect(); return Math.floor((y - b.top) / b.height * r.length); };
      seam.addEventListener('pointerdown', e => { active = true; seam.setPointerCapture(e.pointerId); show(at(e.clientY)); });
      seam.addEventListener('pointermove', e => { if (active) show(at(e.clientY)); });
      seam.addEventListener('pointerup', () => { if (!active) return; active = false; bub.classList.remove('on'); $$('.bars i', seam).forEach(b => b.classList.remove('on')); toast(`Opens ${r[idx].n}`); });
      seam.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { e.preventDefault(); show(idx + 1); } if (e.key === 'ArrowUp') { e.preventDefault(); show(idx - 1); } if (e.key === 'Enter') { bub.classList.remove('on'); toast(`Opens ${r[idx].n}`); } });
      seam.addEventListener('blur', () => bub.classList.remove('on'));
    }
    $$('#dockHost .di, #dockHost .pa, #dockHost .pb:not(.srch)').forEach(b => b.addEventListener('click', () => toast(`Opens ${b.getAttribute('aria-label')}`)));
  }

  const NOTES = {
    '0': { h: 'Current dock', p: 'Five identical icon squares, search, all apps.', pros: 'Familiar. Compact.', cons: 'No names, so Sam reads colours and icons only. Shows 5 of any number of apps; the rest hide behind the menu. Looks like every other app.', v: 'Baseline.' },
    'A': { h: 'A · Selvedge strip', p: 'The dock becomes a fabric selvedge: every app as a named swatch, scrolling sideways, most recent first, with search fixed at the end.', pros: 'Names visible. All apps reachable from the dock without another screen. Thumb-friendly sideways scroll.', cons: 'At 30 apps it’s a long scroll with no overview. Tall dock (76 px) takes screen.', v: 'Good up to about 12 apps.' },
    'B': { h: 'B · Patchwork border + quilt', p: 'The dock is the quilt’s border: your 4 most recent apps sewn together into one strip, plus search. Swipe it up (or tap "all N apps") and the whole quilt unfolds: every app as a patch, sized by how often you open it, filterable by pile.', pros: 'Named, one-tap recent apps. One overview of everything that scales to 30+. The size of each patch tells Sam what matters, and faded patches show what they’ve stopped using, the forgetting tax again. Most "Quilt" of the four.', cons: 'One gesture to learn (there’s also the visible "all N apps" handle). The unfolded quilt is a new screen to build.', v: 'Recommended. Replaces both the dock and the All apps screen.' },
    'C': { h: 'C · Side seam', p: 'No dock. A thin seam of colours on the right edge holds every app; drag your thumb along it and a patch follows your finger, release to open. A search pill sits at the bottom.', pros: 'Takes almost no space. Scales to any number of apps. Very fast once learned, very distinctive.', cons: 'Hard to discover, hard for people with motor impairments, and colours alone identify apps until you touch. Risky on stage.', v: 'Memorable, but too hidden for first users.' }
  };
  function notes() {
    const n = NOTES[concept];
    $('#notes').innerHTML = `<h2>${n.h}</h2><p>${n.p}</p><div class="pc"><div><b>Works</b>${n.pros}</div><div><b>Costs</b>${n.cons}</div></div><p class="verdict">${n.v}</p>
      <div class="try">${concept === 'B' ? '<b>Try:</b> tap "all N apps" (or swipe up on the strip), filter by a pile, then switch to 30 apps.' : concept === 'C' ? '<b>Try:</b> press and drag along the coloured seam on the right edge (arrow keys work when it’s focused).' : concept === 'A' ? '<b>Try:</b> scroll the strip sideways at 30 apps.' : '<b>Try:</b> switch to 30 apps and see what you can reach.'}</div>`;
  }
  function render() { home(); dock(); notes(); }
  $$('[data-d]').forEach(b => b.addEventListener('click', () => { concept = b.dataset.d; $$('[data-d]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); }));
  $$('[data-n]').forEach(b => b.addEventListener('click', () => { count = +b.dataset.n; $$('[data-n]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); }));
  render();
})();
</script>
