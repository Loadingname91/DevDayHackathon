<title>Quilt Flows Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: a flow bench. Scenario switcher on top; a live phone (or laptop) on the left; the decisions it demonstrates on the right. Phone and laptop are the Workbench world, light only; page chrome follows the viewer's theme. */
:root{
  --bg:#EFEEEA; --panel:#FFFFFF; --ink:#1E1F23; --muted:#565A61; --line:#D7D6D0; --accent:#3557A6; --accent-ink:#FFFFFF; --soft:#E7ECF7;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-data:"DM Mono",ui-monospace,Menlo,monospace;
  --muslin:#F4EEE1; --surface:#FFFDF8; --w-ink:#2A2119; --w-ink2:#665847; --stitch:#BFAE90; --denim:#3557A6; --denim-ink:#22396F; --thread:#E3A72F; --moss:#1F6B5E; --wash:#EEE6D6;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141518;--panel:#1C1E22;--ink:#ECEBE6;--muted:#A5A9B0;--line:#2F3238;--accent:#93ABEA;--accent-ink:#111318;--soft:#232A3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141518;--panel:#1C1E22;--ink:#ECEBE6;--muted:#A5A9B0;--line:#2F3238;--accent:#93ABEA;--accent-ink:#111318;--soft:#232A3A;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-block:32px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5vw,56px);letter-spacing:-.035em;line-height:.98;margin:0;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--muted);max-width:72ch}
.controls{display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:transparent;min-height:40px;padding:0 13px;border-radius:9px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sub{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sub .lbl{font-family:var(--f-data);font-size:12px;color:var(--muted);margin-right:6px}
.sub button{border:1px solid var(--line);background:transparent;min-height:36px;padding:0 11px;border-radius:8px;font-size:13px}
.sub button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}
.stage{display:grid;grid-template-columns:376px minmax(0,1fr);gap:32px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.notes{display:flex;flex-direction:column;gap:14px;min-width:0;color:var(--ink)}
.notes h2{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.025em;margin:0;line-height:1.05}
.notes p{margin:0;max-width:64ch}
.beats{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.beats li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:14.5px}
.beats .n{font-family:var(--f-data);font-size:12px;color:var(--muted);padding-top:2px}
.beats li.now{background:var(--soft)}
.beats b{font-weight:600}
.dec{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.try{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.try b{font-weight:600}

/* ---------- phone (Workbench) ---------- */
.phone{width:360px;max-width:100%;height:760px;border-radius:40px;border:8px solid #111216;overflow:hidden;position:relative;background:var(--muslin);color:var(--w-ink);font-family:var(--f-body);box-shadow:0 20px 44px -22px rgba(0,0,0,.4);isolation:isolate}
.screen{position:absolute;inset:0 0 96px 0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.screen.full{bottom:0}
.screen::-webkit-scrollbar{display:none}
.content{position:relative;padding:40px 16px 20px;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:12px;min-height:100%}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.back,.ib{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;border-radius:12px;color:var(--w-ink);flex:none}
.back{margin-left:-12px}
.ib:hover,.back:hover{background:rgba(42,33,25,.06)}
.h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.025em;line-height:1.05}
.h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.subt{margin:0;font-size:13.5px;color:var(--w-ink2)}
.mono{font-family:var(--f-data);font-size:12.5px;font-variant-numeric:tabular-nums}
.small{font-size:12.5px;color:var(--w-ink2)}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;font-family:var(--f-data);font-size:11.5px;letter-spacing:.04em;color:var(--w-ink2)}
.st{--d:7px;--sc:var(--stitch);position:relative;background-color:var(--surface);border-radius:14px;
  background-image:linear-gradient(90deg,var(--sc) 58%,transparent 0),linear-gradient(90deg,var(--sc) 58%,transparent 0),linear-gradient(0deg,var(--sc) 58%,transparent 0),linear-gradient(0deg,var(--sc) 58%,transparent 0);
  background-size:var(--d) 1.5px,var(--d) 1.5px,1.5px var(--d),1.5px var(--d);
  background-position:0 5px,0 calc(100% - 5px),5px 0,calc(100% - 5px) 0;background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;transition:background-size 220ms var(--ease)}
.st.basted{--d:20px;--sc:var(--w-ink2)}
.card{padding:14px;display:flex;flex-direction:column;gap:8px}
.b{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--denim);color:#FFF;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform 120ms var(--ease)}
.b:active{transform:scale(.97)}
.b.ghost{background:transparent;color:var(--w-ink);box-shadow:inset 0 0 0 1.5px var(--stitch)}
.b.ink{background:transparent;color:var(--w-ink);box-shadow:inset 0 0 0 1.5px var(--w-ink)}
.b.wide{width:100%}
.chip{min-height:44px;padding:0 13px;border-radius:11px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--stitch);font-size:13px;color:var(--w-ink);display:inline-flex;align-items:center;gap:6px;flex:none}
.chip[aria-pressed="true"]{background:#E6ECF7;box-shadow:inset 0 0 0 1.5px var(--denim);color:var(--denim-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.tag{font-family:var(--f-data);font-size:11px;font-weight:500;padding:2px 7px;background:var(--thread);color:#1F180D;border-radius:3px;white-space:nowrap}
.ex{font-family:var(--f-data);font-size:11px;color:var(--w-ink2);padding:1px 6px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--stitch);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(42,33,25,.4);display:inline-block;flex:none}
.rows{display:flex;flex-direction:column}
.rowi{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;font-size:14px}
.rowi + .rowi{background:linear-gradient(90deg,var(--stitch) 58%,transparent 0) 0 0/8px 1px repeat-x}
.rowi .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rowi .t span:last-child{font-size:12.5px;color:var(--w-ink2)}
.bar{height:8px;border-radius:4px;background:var(--wash);position:relative;overflow:hidden}
.bar u{position:absolute;inset:0 auto 0 0;background:var(--moss);border-radius:4px}
.bar s{position:absolute;inset:0 0 0 auto;background:repeating-linear-gradient(45deg,var(--w-ink) 0 1.3px,transparent 1.3px 4px),repeating-linear-gradient(-45deg,var(--w-ink) 0 1.3px,transparent 1.3px 4px)}
.big{font-family:var(--f-display);font-weight:800;font-size:36px;letter-spacing:-.035em;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-family:var(--f-data);font-size:11px;text-align:center;color:var(--w-ink2)}
.week span{padding:6px 0;border-radius:8px;background:#F3ECDD;display:flex;flex-direction:column;gap:2px;align-items:center}
.week span.r{background:var(--denim);color:#FFF}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--w-ink2)}
.field input,.field select,.field textarea{min-height:44px;border:0;border-radius:11px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--stitch);padding:0 12px;font:inherit;font-size:15px;color:var(--w-ink)}
.field textarea{padding:12px;resize:none;line-height:1.45}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;box-shadow:inset 0 0 0 2px var(--denim)}
.clair{display:flex;gap:8px;align-items:center;font-family:var(--f-data);font-size:11.5px;color:var(--denim-ink);min-height:30px}
.chalk{position:relative;padding:14px;border-radius:14px;background:rgba(53,87,166,.06);color:var(--denim-ink);display:flex;flex-direction:column;gap:8px}
.chalk>svg.ol,.piece>svg.ol{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.chalk>svg.ol rect,.piece>svg.ol rect{fill:none;stroke:var(--denim);stroke-opacity:.7;stroke-width:2.2;stroke-dasharray:1 6;stroke-linecap:round}
.say{margin:0;font-size:14px;line-height:1.45}
.qmark{width:18px;height:18px;flex:none}
.kind{display:flex;align-items:center;gap:6px;font-family:var(--f-data);font-size:11px;color:var(--w-ink2)}
.piece{position:relative;padding:12px;display:flex;flex-direction:column;gap:8px}
.patchi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.dock{position:absolute;left:12px;right:12px;bottom:18px;height:60px;border-radius:16px;background:var(--surface);display:flex;align-items:center;gap:3px;padding:0 7px;z-index:6;box-shadow:0 8px 22px -14px rgba(42,33,25,.5)}
.dock .di{width:44px;height:44px;border-radius:11px;border:0;display:grid;place-items:center;position:relative;flex:none;color:var(--w-ink)}
.dock .di.on{box-shadow:inset 0 0 0 1.5px var(--denim)}
.dock .sep{width:1px;height:26px;background:var(--stitch);margin:0 2px 0 auto}
.dock .plain{background:transparent}
.toast{position:absolute;left:12px;right:12px;bottom:90px;z-index:9;background:var(--w-ink);color:#FBF6EC;border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.35;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity 220ms var(--ease),transform 220ms var(--ease)}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{margin-left:auto;flex:none;min-height:40px;padding:0 12px;border-radius:9px;border:1.5px solid rgba(251,246,236,.5);background:transparent;color:#FBF6EC;font-weight:600;font-size:13px}
.scrim{position:absolute;inset:0;background:rgba(42,33,25,.32);z-index:10;opacity:0;pointer-events:none;transition:opacity 220ms}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;background:var(--muslin);border-radius:22px 22px 0 0;padding:10px 16px 26px;display:flex;flex-direction:column;gap:12px;max-height:82%;overflow-y:auto;transform:translateY(105%);transition:transform 350ms var(--ease);box-shadow:0 -10px 30px -18px rgba(42,33,25,.6)}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--stitch);margin:0 auto 4px}
.pager{display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--stitch)}
.dots i.on{background:var(--w-ink)}
.toggle{width:52px;height:32px;border-radius:16px;border:0;padding:3px;background:var(--stitch);display:flex;flex:none;transition:background 220ms}
.toggle::after{content:"";width:26px;height:26px;border-radius:50%;background:#FFF;transition:transform 220ms var(--ease)}
.toggle[aria-checked="true"]{background:var(--denim)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.tgwrap{min-width:52px;min-height:44px;display:grid;place-items:center}
.swrow{position:relative;overflow:hidden;touch-action:pan-y;user-select:none}
.swrow .act{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:600;font-size:13px}
.swrow .act .l{color:var(--moss);display:flex;gap:6px;align-items:center}
.swrow .act .r{color:var(--w-ink);display:flex;gap:6px;align-items:center}
.swrow .fg{position:relative;background:var(--surface);touch-action:pan-y}
.swrow.sel .fg{background:#E6ECF7}
.ck{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--w-ink2);display:grid;place-items:center;flex:none}
.ck.on{background:var(--moss);box-shadow:none;color:#FFF}
.radio{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--stitch);cursor:pointer}
.radio input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--denim);flex:none}
.radio:has(input:checked){box-shadow:inset 0 0 0 2px var(--denim)}
.meter{height:10px;border-radius:5px;background:var(--wash);overflow:hidden}
.meter u{display:block;height:100%;background:var(--denim);border-radius:5px}
.grip{width:44px;height:44px;margin:-8px -6px -8px -10px;border:0;background:transparent;display:grid;place-items:center;color:var(--w-ink2);touch-action:none;cursor:grab;flex:none}
.arr .piece.dragging{z-index:5;box-shadow:0 14px 28px -14px rgba(42,33,25,.55);cursor:grabbing}
.vseg{display:inline-flex;border-radius:9px;box-shadow:inset 0 0 0 1.5px var(--stitch);overflow:hidden}
.vseg button{min-height:36px;min-width:44px;padding:0 9px;border:0;background:transparent;font-size:12px;color:var(--w-ink2)}
.vseg button[aria-pressed="true"]{background:var(--w-ink);color:#FBF6EC}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--f-data);font-weight:500;font-size:11px;color:var(--w-ink2);text-align:left;padding:4px 6px}
.tbl td{padding:8px 6px;border-top:1px solid var(--wash)}
.tbl td:last-child,.tbl th:last-child{text-align:right;font-family:var(--f-data)}
.pull{display:flex;justify-content:center;margin:-34px 0 -6px}
.pull button{border:0;background:transparent;min-height:36px;padding:0 12px;font-family:var(--f-data);font-size:11px;color:var(--w-ink2);display:flex;align-items:center;gap:6px}
.answer{padding:12px 14px;border-radius:14px;background:rgba(53,87,166,.06);color:var(--denim-ink);display:flex;flex-direction:column;gap:6px;position:relative}

/* spool */
.sp{overflow:visible;flex:none}
.sp .body{transform-box:fill-box;transform-origin:50% 100%}
.sp .eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.2s infinite}
.sp-bob .body{animation:bob 560ms ease-in-out infinite alternate}
.sp-hop .body{animation:hop 420ms var(--ease) 1}
.sp-shake .body{animation:shake 320ms ease-in-out 1}
.sp-breathe .body{animation:breathe 2.6s ease-in-out infinite}
.sp-think .dots2 circle{animation:pulse 1.2s ease-in-out infinite}
.sp-think .dots2 circle:nth-child(2){animation-delay:.2s}.sp-think .dots2 circle:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes hop{0%{transform:none}35%{transform:translateY(-7px)}70%{transform:translateY(1px)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- laptop ---------- */
.lapwrap{overflow-x:auto;border-radius:18px}
.laptop{min-width:980px;height:640px;border-radius:18px;border:10px solid #111216;background:var(--muslin);color:var(--w-ink);font-family:var(--f-body);display:grid;grid-template-columns:220px minmax(0,1fr) 300px;overflow:hidden;position:relative}
.laptop.build{grid-template-columns:400px minmax(0,1fr)}
.side{border-right:1.5px solid var(--wash);padding:18px 12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.side .k{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--stitch);font-size:13px;color:var(--w-ink2)}
.side .k kbd{margin-left:auto;font-family:var(--f-data);font-size:11px;padding:1px 6px;border-radius:5px;background:var(--wash)}
.side .tb{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 8px;border-radius:10px;font-size:14px;border:0;background:transparent;text-align:left}
.side .tb.on{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--stitch);font-weight:600}
.side .tb .patchi{width:26px;height:26px;border-radius:8px}
.mainp{padding:22px 26px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.detail{border-left:1.5px solid var(--wash);padding:22px 18px;display:flex;flex-direction:column;gap:12px;background:var(--surface);overflow-y:auto}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 170px 80px;gap:10px;align-items:center;min-height:46px;padding:0 12px;font-size:14px;border-radius:10px;border:0;background:transparent;text-align:left;width:100%}
.lrow.on{background:#E6ECF7;box-shadow:inset 0 0 0 1.5px var(--denim)}
.lrow span:last-child{text-align:right;font-family:var(--f-data)}
.chat{border-right:1.5px solid var(--wash);padding:20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;background:var(--surface)}
.bub{align-self:flex-end;max-width:85%;padding:10px 14px;border-radius:14px 14px 4px 14px;background:var(--wash);font-size:14px}
.prevp{padding:22px 30px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.prevp .frame{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}

@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}.phone{margin:0 auto}}
@media (max-width:420px){.phone{border-width:6px}}
@media (prefers-reduced-motion:reduce){.sp .body,.sp .eyes,.sp .dots2 circle{animation:none!important}.sheet,.toast,.st,.scrim{transition-duration:120ms}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3 7h18v12H3zM3 10h18M16 15h2"/></symbol>
  <symbol id="i-lift" viewBox="0 0 24 24"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.5h10.6L20 7H6.2M9 19.5h.01M17 19.5h.01"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 12V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 12v3a3 3 0 0 1-3 3H4"/></symbol>

  <symbol id="q-progress" viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" fill="none" stroke="#2A2119" stroke-width="1.3"/><path d="M2 18L6 10L10 18ZM10 18L14 10L18 18ZM2 10L6 2L10 10ZM10 10L14 2L18 10Z" fill="#F8DCC2" stroke="#2A2119" stroke-width="1.1"/></symbol>

  <symbol id="q-cal" viewBox="0 0 20 20"><path d="M2 2h16v16H2z M2 7.3h16 M2 12.6h16 M7.3 2v5.3 M12.6 7.3v5.3 M7.3 12.6V18" fill="none" stroke="#2A2119" stroke-width="1.3"/></symbol>

  <symbol id="q-chart" viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" fill="none" stroke="#2A2119" stroke-width="1.3"/><path d="M2 18L18 2V18Z" fill="#EADCF0" stroke="#2A2119" stroke-width="1.3"/></symbol>

<main class="wrap">
  <header>
    <h1>Quilt Flows Prototype</h1>
    <p class="lede">Every decision from the last grilling round, rendered and clickable. Pick a scenario; the phone (or laptop) is live, and the notes on the right show which decision each part demonstrates. Rows in the build preview are examples.</p>
  </header>

  <div class="controls" role="group" aria-label="Scenario controls">
    <div class="seg" role="group" aria-label="Scenario">
      <button type="button" data-sc="build" aria-pressed="true">1 · Build a tab</button>
      <button type="button" data-sc="stitched" aria-pressed="false">2 · Stitched into Calendar</button>
      <button type="button" data-sc="search" aria-pressed="false">3 · Search</button>
      <button type="button" data-sc="rows" aria-pressed="false">4 · Edit rows</button>
      <button type="button" data-sc="settings" aria-pressed="false">5 · Settings + activity</button>
      <button type="button" data-sc="laptop" aria-pressed="false">6 · Laptop</button>
    </div>
    <div class="sub" id="subctl"></div>
  </div>

  <div class="stage" id="stage">
    <div id="device"></div>
    <div class="notes" id="notes" aria-live="polite"></div>
  </div>
</main>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const EASE = 'cubic-bezier(.16,1,.3,1)';
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const icon = (id, size = 18) => `<svg class="ico" style="width:${size}px;height:${size}px" aria-hidden="true"><use href="#${id}"/></svg>`;
  const qm = id => `<svg class="qmark" viewBox="0 0 20 20" aria-hidden="true"><use href="#q-${id}"/></svg>`;
  const DYES = ['#FBEBC4', '#DDEBD2', '#D3ECE7', '#F8DCC2', '#DCE4F3', '#EADCF0', '#E7EBC2', '#F3DCE0'];
  const DYE_NAMES = ['butter', 'sage', 'sea glass', 'apricot', 'chambray', 'lavender', 'pear', 'blush'];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const chalkOl = () => `<svg class="ol" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" rx="14"/></svg>`;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let runId = 0;

  /* spool buddy: Clair's face */
  function spool(expr, size = 44) {
    const W = '#FFFFFF';
    const eyes = (dx = 0, dy = 0) => `<g class="eyes"><circle cx="${23 + dx}" cy="${26 + dy}" r="2.3" fill="${W}"/><circle cx="${33 + dx}" cy="${26 + dy}" r="2.3" fill="${W}"/></g>`;
    const P = d => `<path d="${d}" fill="none" stroke="${W}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
    const happy = P('M20.5 27 q2.5 -3.5 5 0 M30.5 27 q2.5 -3.5 5 0');
    let face = '', extra = '', tail = 'M14 38 C8 40 5 43 0 45', cls = '';
    if (expr === 'hello') { face = eyes() + P('M24 31 q4 3 8 0'); cls = 'sp-hop'; }
    if (expr === 'working') { face = eyes(1.5, 1.5) + `<ellipse cx="29.5" cy="33" rx="1.8" ry="1.5" fill="${W}"/>`; cls = 'sp-bob'; }
    if (expr === 'thinking') { face = eyes(1.5, -2) + P('M26 33 h5'); extra = `<g class="dots2"><circle cx="50" cy="8" r="1.8" fill="#2A2119"/><circle cx="55" cy="2" r="2.2" fill="#2A2119"/><circle cx="61" cy="-5" r="2.6" fill="#2A2119"/></g>`; cls = 'sp-think'; }
    if (expr === 'waiting') { face = eyes() + P('M20.5 21 q2.5 -2 5 0 M30.5 21 q2.5 -2 5 0') + P('M25 31.5 q3 2 6 0'); extra = `<path d="M42 8 L56 -6" stroke="#9BA0A8" stroke-width="2.4" stroke-linecap="round"/><path d="M54 -4 C60 -3 62 3 58 9" fill="none" stroke="#E3A72F" stroke-width="1.5" stroke-linecap="round"/>`; }
    if (expr === 'happy') { face = happy + P('M23.5 30.5 q4.5 4.5 9 0'); cls = 'sp-hop'; }
    if (expr === 'proud') { face = happy + `<circle cx="18.5" cy="31" r="2.1" fill="#F8DCC2"/><circle cx="37.5" cy="31" r="2.1" fill="#F8DCC2"/><path d="M23 30 q5 6.5 10 0 z" fill="${W}"/>`; cls = 'sp-hop'; }
    if (expr === 'oops') { face = eyes(0, 1) + P('M20.5 22.5 L25.5 20.5 M30.5 20.5 L35.5 22.5') + P('M23.5 33.5 q1.5 -1.6 3 0 t3 0 t3 0'); tail = 'M14 38 l-3 1 l1.5 2.5 l-3.5 .5 l1.5 2.5 l-4 .5'; cls = 'sp-shake'; }
    if (expr === 'sleepy') { face = P('M20.5 26 q2.5 2 5 0 M30.5 26 q2.5 2 5 0') + P('M26 32.5 q2 1.2 4 0'); cls = 'sp-breathe'; }
    return `<svg class="sp ${cls}" width="${size}" height="${Math.round(size * 70 / 68)}" viewBox="-6 -10 68 70" aria-hidden="true"><g class="body"><path d="${tail}" fill="none" stroke="#2A2119" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="6" width="36" height="8" rx="3" fill="#D9B98F" stroke="#2A2119" stroke-width="1.6"/><rect x="14" y="14" width="28" height="28" fill="#3557A6" stroke="#2A2119" stroke-width="1.6"/><path d="M14 18.5h28M14 38h28" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="1.4"/><rect x="10" y="42" width="36" height="8" rx="3" fill="#D9B98F" stroke="#2A2119" stroke-width="1.6"/>${face}</g>${extra}</svg>`;
  }

  /* ---------- device scaffold ---------- */
  const device = $('#device'), notes = $('#notes'), stage = $('#stage'), subctl = $('#subctl');
  function phone(withDock = true) {
    device.innerHTML = `<div class="phone" id="phone" aria-label="Quilt phone prototype">
      <div class="screen${withDock ? '' : ' full'}" id="screen"><div class="content" id="content"></div></div>
      ${withDock ? '<nav class="dock" id="dock" aria-label="Recent tabs"></nav>' : ''}
      <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button type="button" id="toastBtn"></button></div>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Sheet"></div>
    </div>`;
    $('#scrim').addEventListener('click', closeSheet);
    return $('#content');
  }
  const TABS = { budget: { n: 'Budget', i: 2, ic: 'i-wallet' }, groceries: { n: 'Groceries', i: 1, ic: 'i-cart' }, calendar: { n: 'Calendar', i: 4, ic: 'i-cal' }, todos: { n: 'To-dos', i: 0, ic: 'i-check' }, workout: { n: 'Workout', i: 3, ic: 'i-lift' }, subs: { n: 'Subscriptions', i: 5, ic: 'i-repeat' } };
  function dock(active, recent = ['budget', 'groceries', 'calendar', 'todos', 'workout'], onSearch) {
    const d = $('#dock'); if (!d) return;
    d.innerHTML = recent.map(k => `<button type="button" class="di${k === active ? ' on' : ''}" aria-label="${TABS[k].n}" ${k === active ? 'aria-current="page"' : ''} style="background:${DYES[TABS[k].i]}">${icon(TABS[k].ic)}</button>`).join('')
      + `<span class="sep" aria-hidden="true"></span><button type="button" class="di plain" id="dockSearch" aria-label="Search">${icon('i-search')}</button><button type="button" class="di plain" aria-label="All tabs">${icon('i-menu')}</button>`;
    if (onSearch) $('#dockSearch').addEventListener('click', onSearch);
  }
  let toastTimer;
  function toast(text, btn, fn) {
    const t = $('#toast'); if (!t) return;
    $('#toastText').textContent = text; const b = $('#toastBtn');
    b.hidden = !btn; b.textContent = btn || ''; b.onclick = () => { t.classList.remove('on'); fn && fn(); };
    t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 5000);
  }
  let sheetReturn = null;
  function openSheet(html, label) {
    const s = $('#sheet'); s.innerHTML = `<div class="grab" aria-hidden="true"></div>${html}`; s.setAttribute('aria-label', label || 'Sheet');
    sheetReturn = document.activeElement; $('#scrim').classList.add('on'); s.classList.add('on');
    setTimeout(() => { const f = s.querySelector('input,button,select,textarea'); f && f.focus(); }, 60);
    return s;
  }
  function closeSheet() { const s = $('#sheet'); if (!s) return; s.classList.remove('on'); $('#scrim').classList.remove('on'); sheetReturn && sheetReturn.focus && sheetReturn.focus(); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  function setNotes(html, now) { notes.innerHTML = html; markBeat(now); }
  function markBeat(i) { $$('.beats li', notes).forEach((li, k) => li.classList.toggle('now', k === i)); }
  function setSub(html) { subctl.innerHTML = html; subctl.hidden = !html; }

  /* =========================================================
     1. BUILD A TAB
     ========================================================= */
  const SUBS = [
    { n: 'Spotify', when: 'renews Sun 22 Nov', day: 22, p: 11.99 },
    { n: 'Hulu', when: 'not opened in 45 days', day: 28, p: 9.99 },
    { n: 'Adobe CC, student', when: 'renews 3 Dec', day: 3, p: 13.49 },
    { n: 'iCloud 50 GB', when: 'renews 9 Dec', day: 9, p: 2.99 }
  ];
  const PIECE = {
    metric: { k: 'metric', mark: 'metric', name: 'Monthly total' },
    progress: { k: 'progress', mark: 'progress', name: 'Under your $40 cap' },
    list: { k: 'list', mark: 'list', name: 'Renewals', view: 'list' },
    cal: { k: 'cal', mark: 'cal', name: 'Renewal dates' },
    form: { k: 'form', mark: 'form', name: 'Add a subscription' },
    chart: { k: 'chart', mark: 'chart', name: 'Cost by month' },
    text: { k: 'text', mark: 'text', name: 'Notes' },
    collection: { k: 'collection', mark: 'collection', name: 'Categories' },
    page: { k: 'page', mark: 'page', name: 'Sub-page' }
  };
  const LAYOUTS = [
    { name: 'List first', pieces: ['list', 'metric', 'cal', 'form'] },
    { name: 'Calendar first', pieces: ['cal', 'list', 'metric', 'form'] },
    { name: 'Summary first', pieces: ['metric', 'progress', 'list', 'form'] }
  ];
  const B = { step: 0, layout: 0, pieces: [], name: 'Subscriptions', dye: 5, ic: 'i-repeat', conn: { cal: true, budget: true, nudge: false }, keep: false, answer: null, uid: 0 };
  const newPiece = k => ({ ...PIECE[k], id: 'p' + (++B.uid) });
  const total = SUBS.reduce((a, s) => a + s.p, 0).toFixed(2);

  function pieceBody(p) {
    const exRow = s => `<div class="rowi"><span class="t"><span>${s.n}</span><span>${s.when}</span></span><span class="ex">example</span><span class="mono">$${s.p.toFixed(2)}</span></div>`;
    if (p.k === 'metric') return `<div style="display:flex;align-items:baseline;gap:8px"><span class="big">$${total}</span><span class="small">a month · 4 subscriptions</span></div>`;
    if (p.k === 'progress') return `<div class="bar"><u style="width:96%"></u></div><div class="small">$${total} of $40 · 96%</div>`;
    if (p.k === 'cal' || (p.k === 'list' && p.view === 'calendar')) {
      const days = [['F', 20], ['S', 21], ['S', 22], ['M', 23], ['T', 24], ['W', 25], ['T', 26]];
      return `<div class="week">${days.map(([d, n]) => `<span class="${n === 22 ? 'r' : ''}">${d}<b class="mono" style="font-size:12px">${n}</b></span>`).join('')}</div><div class="small">Sun 22: Spotify renews · $11.99 <span class="ex">example</span></div>`;
    }
    if (p.k === 'list' && p.view === 'table') return `<table class="tbl"><thead><tr><th scope="col">Name</th><th scope="col">Renews</th><th scope="col">Cost</th></tr></thead><tbody>${SUBS.map(s => `<tr><td>${s.n} <span class="ex">example</span></td><td class="small">${s.when.replace('renews ', '')}</td><td>$${s.p.toFixed(2)}</td></tr>`).join('')}</tbody></table>`;
    if (p.k === 'list') return `<div class="rows" style="margin:0 -12px">${SUBS.map(exRow).join('')}</div>`;
    if (p.k === 'form') return `<div style="display:flex;gap:8px"><span class="st basted" style="flex:1;min-height:44px;background-color:transparent;display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--w-ink2)">Name, price, renews on</span><span class="b" style="min-width:64px">Add</span></div>`;
    if (p.k === 'chart') return `<div style="display:flex;align-items:flex-end;gap:8px;height:70px">${[30, 34, 38, 38].map((v, i) => `<span style="flex:1;height:${v * 1.6}px;border-radius:6px 6px 2px 2px;background:${i === 3 ? '#3557A6' : '#B9C7E6'}"></span>`).join('')}</div><div class="small">Aug–Nov <span class="ex">example</span></div>`;
    if (p.k === 'text') return `<div class="small">Cancel anything I haven't opened in a month. <span class="ex">example</span></div>`;
    if (p.k === 'collection') return `<div class="chips" style="margin:0;padding:0">${['music', 'video', 'school', 'storage'].map(c => `<span class="chip" style="min-height:32px">${c}</span>`).join('')}</div>`;
    return `<div class="small">A sub-page for anything that doesn't fit.</div>`;
  }
  const pieceCard = p => `<section class="st card" aria-label="${p.name}"><div class="sect" style="margin:0"><span>${p.name.toUpperCase()}</span></div>${pieceBody(p)}</section>`;

  const BUILD_STEPS = ['Describe', 'Build', 'Preview', 'Arrange', 'Stitch', 'Landed'];
  const BUILD_NOTES = () => `
    <h2>Build a tab</h2>
    <p>Five screens, then you land in the new tab. Use the buttons inside the phone, or jump with the step chips above.</p>
    <ol class="beats">
      <li><span class="n">1</span><span><b>Describe:</b> the sentence comes first, with suggestion chips; ready-made patterns below skip straight to the preview. <span class="dec">Q40</span></span></li>
      <li><span class="n">2</span><span><b>Build:</b> chalk outlines become basted pieces; the spool works, thinks, and asks one quick-choice question because "warn me" is ambiguous. <span class="dec">Q28</span></span></li>
      <li><span class="n">3</span><span><b>Preview:</b> the whole tab with labelled example rows. Swipe or tap the arrows to compare List first, Calendar first and Summary first. <span class="dec">Q25 · Q26 · Q32</span></span></li>
      <li><span class="n">4</span><span><b>Arrange:</b> drag the grip (or use arrow keys on it), rip a piece out, add one of the 9 blocks, flip list / table / calendar, or tell Clair. <span class="dec">Q33</span></span></li>
      <li><span class="n">5</span><span><b>Stitch:</b> name, dye and icon are pre-filled on top; Clair's connections are pre-ticked and say what flows; example rows clear unless kept. <span class="dec">Q27 · Q42</span></span></li>
      <li><span class="n">6</span><span><b>Landed:</b> the new tab, empty and ready; the spool says hello and offers snap, type, or import from Budget. <span class="dec">Q41</span></span></li>
    </ol>`;
  function buildSub() {
    setSub(`<span class="lbl">step</span>${BUILD_STEPS.map((s, i) => `<button type="button" data-step="${i}" aria-pressed="${i === B.step}">${i + 1} ${s}</button>`).join('')}`);
    $$('[data-step]', subctl).forEach(b => b.addEventListener('click', () => { if (+b.dataset.step >= 3 && !B.pieces.length) B.pieces = LAYOUTS[B.layout].pieces.map(newPiece); goStep(+b.dataset.step); }));
  }
  function goStep(i) { B.step = i; runId++; buildSub(); markBeat(i); [b1, b2, b3, b4, b5, b6][i](); }

  function b1() {
    const c = phone(false);
    c.innerHTML = `
      <div class="top"><button type="button" class="back" aria-label="Back to all tabs">${icon('i-back', 22)}</button><span class="small">new tab</span><span style="width:44px"></span></div>
      <div style="display:flex;gap:12px;align-items:center">${spool('hello', 44)}<h2 class="h1" style="font-size:24px">What do you want to keep track of?</h2></div>
      <label class="field"><span>Say it the way you'd tell a friend</span><textarea id="say" rows="3">Track my subscriptions and warn me before they renew</textarea></label>
      <div class="chips">${['log my lifts and PRs', 'plan meals from my pantry', 'track internship applications'].map(s => `<button type="button" class="chip" data-say="${s}">${s}</button>`).join('')}</div>
      <button type="button" class="b wide" id="buildIt">Build it</button>
      <div class="sect"><span>OR START FROM A PATTERN</span><span>skips to preview</span></div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
        ${[['Subscriptions', 5, 'i-repeat', '4 blocks'], ['Lift log', 3, 'i-lift', '5 blocks'], ['Meal plan', 1, 'i-cart', '4 blocks'], ['Job hunt', 4, 'i-book', '4 blocks']].map(([n, d, ic, b]) => `<button type="button" class="pat" data-pat="${n}" style="min-height:84px;border:0;border-radius:14px;background:${DYES[d]};display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:12px;text-align:left">${icon(ic)}<span style="display:flex;flex-direction:column"><b style="font-size:14px">${n}</b><span class="small">${b}</span></span></button>`).join('')}
      </div>`;

      { id: 'e', t: 'Spinach', s: '1 bag', got: false },
      { id: 'f', t: 'Coffee beans', s: '1 bag', got: false }
    ];
    let sel = null;
    const c = phone(true);
    const draw = () => {
      c.innerHTML = `
        <div class="top"><button type="button" class="back" aria-label="Back to home">${icon('i-back', 22)}</button><span></span><button type="button" class="ib" aria-label="Groceries tab menu">${icon('i-more')}</button></div>

        ${sel ? `<div style="display:flex;align-items:center;gap:8px;min-height:44px"><b>${sel.size} selected</b><button type="button" class="b ghost" id="mGot" style="margin-left:auto;min-height:40px">Got them</button><button type="button" class="b ink" id="mDel" style="min-height:40px">Delete</button><button type="button" class="ib" id="mX" aria-label="Stop selecting">${icon('i-x')}</button></div>` : `<div class="sect"><span>TO BUY · ${items.filter(i => !i.got).length}</span><span>swipe or tap</span></div>`}
        <section class="st card" style="padding:2px 0;gap:0;overflow:hidden">${items.map(i => `
          <div class="swrow${sel && sel.has(i.id) ? ' sel' : ''}" data-id="${i.id}">
            <div class="act" aria-hidden="true"><span class="l">${icon('i-check')}Got it</span><span class="r">Delete${icon('i-trash')}</span></div>
            <div class="fg rowi" role="button" tabindex="0" aria-label="${i.t}, ${i.s}. Enter to edit" style="${i.got ? 'color:var(--w-ink2)' : ''}">
              <span class="ck${i.got || (sel && sel.has(i.id)) ? ' on' : ''}" aria-hidden="true">${i.got || (sel && sel.has(i.id)) ? icon('i-check', 14) : ''}</span>
              <span class="t"><span style="${i.got ? 'text-decoration:line-through' : ''}">${i.t}</span><span>${i.s}</span></span>
            </div>
          </div>`).join('')}</section>`;
      dock('groceries');
      $$('.swrow', c).forEach(bindRow);
      if (sel) {
        $('#mX').addEventListener('click', () => { sel = null; draw(); });
        $('#mGot').addEventListener('click', () => { const ids = [...sel]; items.forEach(i => { if (sel.has(i.id)) i.got = true; }); sel = null; draw(); toast(`Marked ${ids.length} as got.`, 'Undo', () => { items.forEach(i => { if (ids.includes(i.id)) i.got = false; }); draw(); }); });
        $('#mDel').addEventListener('click', () => { const removed = items.filter(i => sel.has(i.id)); removed.forEach(r => items.splice(items.indexOf(r), 1)); sel = null; draw(); toast(`Deleted ${removed.length}.`, 'Undo', () => { items.push(...removed); draw(); }); });
      }
    };
    function bindRow(row) {
      const fg = row.querySelector('.fg'); const id = row.dataset.id; const it = items.find(i => i.id === id);
      let x0 = 0, dx = 0, down = false, lp = null, moved = false;
      fg.addEventListener('pointerdown', e => {
        down = true; moved = false; x0 = e.clientX; dx = 0; fg.setPointerCapture(e.pointerId);
        lp = setTimeout(() => { if (!moved) { down = false; sel = sel || new Set(); sel.add(id); draw(); } }, 520);
      });
      fg.addEventListener('pointermove', e => {
        if (!down) return; dx = e.clientX - x0; if (Math.abs(dx) > 6) { moved = true; clearTimeout(lp); }
        if (moved && !sel) fg.style.transform = `translateX(${Math.max(-130, Math.min(130, dx))}px)`;
      });
      const end = () => {
        if (!down) return; down = false; clearTimeout(lp);
        if (sel) { if (!moved) { sel.has(id) ? sel.delete(id) : sel.add(id); if (!sel.size) sel = null; draw(); } return; }
        if (dx > 90) { it.got = !it.got; draw(); toast(`${it.t}: ${it.got ? 'got it' : 'back on the list'}.`, 'Undo', () => { it.got = !it.got; draw(); }); return; }
        if (dx < -90) { const idx = items.indexOf(it); items.splice(idx, 1); draw(); toast(`Deleted ${it.t}.`, 'Undo', () => { items.splice(idx, 0, it); draw(); }); return; }
        fg.animate([{ transform: fg.style.transform || 'none' }, { transform: 'none' }], { duration: 220, easing: EASE }); fg.style.transform = '';
        if (!moved) editSheet(it);
      };
      fg.addEventListener('pointerup', end); fg.addEventListener('pointercancel', () => { down = false; clearTimeout(lp); fg.style.transform = ''; });
      fg.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); editSheet(it); } });
    }
    function editSheet(it) {
      const s = openSheet(`<b class="h2">Edit item</b>
        <label class="field"><span>Name</span><input id="eN" value="${esc(it.t)}"></label>
        <label class="field"><span>Amount</span><input id="eA" value="${esc(it.s.split(' · ')[0])}"></label>
        <label class="field"><span>Category</span><select id="eC"><option>Dairy</option><option>Produce</option><option>Meat</option><option>Pantry</option></select></label>
        ${it.s.includes('receipt') ? `<p class="small" style="margin:0;display:flex;gap:6px;align-items:center"><i class="dot" style="background:${DYES[2]}"></i>From your Corner Market receipt · also in Budget</p>` : ''}
        <div style="display:grid;grid-template-columns:1fr 1.5fr;gap:8px"><button type="button" class="b ink" id="eDel">${icon('i-trash')}Delete</button><button type="button" class="b" id="eSave">Save</button></div>`, 'Edit item');
      $('#eSave', s).addEventListener('click', () => { const old = { ...it }; it.t = $('#eN', s).value || it.t; const amt = $('#eA', s).value; it.s = [amt, ...it.s.split(' · ').slice(1)].filter(Boolean).join(' · '); closeSheet(); draw(); toast('Saved.', 'Undo', () => { Object.assign(it, old); draw(); }); });
      $('#eDel', s).addEventListener('click', () => { const idx = items.indexOf(it); items.splice(idx, 1); closeSheet(); draw(); toast(`Deleted ${it.t}.`, 'Undo', () => { items.splice(idx, 0, it); draw(); }); });
    }
    draw();
    setNotes(`
      <h2>Edit rows</h2>
      <p>Fixing a misread receipt item has to take seconds.</p>
      <ol class="beats">
        <li><span class="n">a</span><span><b>Tap</b> a row → edit sheet with its fields, where it came from, and Delete (ink, never red). Enter works on keyboard. <span class="dec">Q35</span></span></li>
        <li><span class="n">b</span><span><b>Swipe right</b> → got it (moss). <b>Swipe left</b> → delete. Both undo from the toast.</span></li>
        <li><span class="n">c</span><span><b>Long-press</b> → select several, then "Got them" or Delete in one go.</span></li>
      </ol>
      <div class="try"><b>Try:</b> drag a row sideways with the mouse, press and hold another, or tap Oat milk to edit it.</div>`);
  }

          <div class="top"><button type="button" class="back" aria-label="Back to home">${icon('i-back', 22)}</button><b>You</b><span style="width:44px"></span></div>
          <div class="sect"><span>ACTIVITY · WHAT CLAIR CHANGED</span><span>all tabs</span></div>
          <section class="st card" style="padding:2px 12px;gap:0">${acts.map((a, i) => `<div style="display:flex;gap:10px;align-items:center;min-height:62px;${i ? 'background:linear-gradient(90deg,var(--stitch) 58%,transparent 0) 0 0/8px 1px repeat-x' : ''}${a.undone ? ';color:var(--w-ink2)' : ''}"><span style="flex:1;display:flex;flex-direction:column;font-size:14px"><span style="${a.undone ? 'text-decoration:line-through' : ''}">${a.t}</span><span class="small">${a.undone ? 'Undone' : a.s}</span></span><button type="button" class="b ghost" data-act="${i}" style="min-height:40px;padding:0 12px">${a.undone ? 'Redo' : 'Undo'}</button></div>`).join('')}</section>
          <div class="sect"><span>CLAIR CREDITS</span><span>Free plan</span></div>
          <section class="st card"><div style="display:flex;align-items:baseline;gap:8px"><span class="big" style="font-size:30px">32</span><span class="small">of 50 left · resets Dec 1</span></div><div class="meter" role="meter" aria-valuemin="0" aria-valuemax="50" aria-valuenow="32" aria-label="Clair credits left"><u style="width:64%"></u></div><span class="small">A chat step is 1, a photo fill 5, building a tab 10. At zero, Clair pauses; your tabs keep working.</span><button type="button" class="b ghost" style="align-self:flex-start;min-height:40px">See Plus · $6 a month</button></section>
          <div class="sect"><span>WHAT CLAIR CAN READ</span></div>
          <fieldset style="border:0;padding:0;margin:0;display:grid;gap:8px"><legend style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">What Clair can read</legend>
            ${[['full', 'Full help', 'Clair reads your rows to answer and fill tabs. Sent to the AI provider only when you ask.'], ['fields', 'Field names only', 'Clair sees column names, never your values. Answers get vaguer.'], ['none', 'Nothing', 'Clair is off. Tabs, search and stitches still work.']].map(([v, t, s], i) => `<label class="radio"><input type="radio" name="read" value="${v}" ${i === 0 ? 'checked' : ''}><span style="display:flex;flex-direction:column"><b style="font-size:14px">${t}</b><span class="small">${s}</span></span></label>`).join('')}
          </fieldset>
          <div class="sect"><span>YOUR DATA</span></div>
          <button type="button" class="b ghost wide" style="justify-content:space-between">Export everything (tabs + data)${icon('i-import')}</button>
          <button type="button" class="b ink wide" id="delAcc" style="justify-content:space-between">Delete my account${icon('i-arrow')}</button>
          <p class="small" style="margin:0">Encrypted with a key for your account. Deleting destroys your data and the key.</p>`;
        $('.back', c).addEventListener('click', () => { screen = 'home'; draw(); });
        $$('[data-act]', c).forEach(b => b.addEventListener('click', () => { const a = acts[+b.dataset.act]; a.undone = !a.undone; draw(); toast(a.undone ? `Undone: ${a.t.toLowerCase()}.` : 'Redone.'); }));
        $('#delAcc').addEventListener('click', () => {
          const s = openSheet(`<b class="h2">Delete your account?</b><p style="margin:0;font-size:14px">This removes all 7 tabs, every row and your encryption key. It can't be undone. Export first if you want a copy.</p><label class="field"><span>Type DELETE to confirm</span><input id="dc" autocomplete="off"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" class="b ghost" id="dcCancel">Keep my account</button><button type="button" class="b ink" id="dcGo" disabled>Delete</button></div>`, 'Delete account');
          $('#dc', s).addEventListener('input', e => { $('#dcGo', s).disabled = e.target.value !== 'DELETE'; });
          $('#dcCancel', s).addEventListener('click', closeSheet);
          $('#dcGo', s).addEventListener('click', () => { closeSheet(); toast('Prototype: nothing was deleted.'); });
        });
      }
    };
    dock('budget');
    draw();
    setNotes(`
      <h2>Settings + activity</h2>
      <p>The trust promises from the pitch, made into one screen behind the profile button.</p>
      <ol class="beats">
        <li><span class="n">a</span><span><b>Profile</b> top-right on Home opens "You". <span class="dec">Q36</span></span></li>
        <li><span class="n">b</span><span><b>Activity first:</b> every change Clair made, across all tabs, each with Undo (and Redo). Per-tab History lives in each tab's menu.</span></li>
        <li><span class="n">c</span><span><b>Credits:</b> what's left this month and what each action costs; at zero Clair pauses, tabs keep working. The same meter sits in Clair's chat header.</span></li>
        <li><span class="n">d</span><span><b>What Clair can read:</b> full help, field names only, or nothing, each said plainly.</span></li>
        <li><span class="n">e</span><span><b>Your data:</b> export everything; delete asks you to type DELETE. Destructive is ink, never red.</span></li>
      </ol>
      <div class="try"><b>Try:</b> tap the profile button, undo the receipt stitch, switch to "Field names only".</div>`);
  }

  /* =========================================================
     6. LAPTOP
     ========================================================= */
  function laptop() {
    let mode = 'use', selRow = 0;
    const recent = [['Corner Market', 'Groceries · just now', '$35.83'], ['Union food court', 'Eating out · yesterday', '$11.40'], ['Gas', 'Transport · Tue', '$28.00'], ['Spotify', 'Subscriptions · Nov 22', '$11.99']];

      setSub(`<span class="lbl">mode</span><button type="button" data-lm="use" aria-pressed="${mode === 'use'}">Using a tab</button><button type="button" data-lm="build" aria-pressed="${mode === 'build'}">Building a tab</button>`);
      $$('[data-lm]', subctl).forEach(b => b.addEventListener('click', () => { mode = b.dataset.lm; render(); }));
      const side = active => `<aside class="side" aria-label="Tabs">
          <span style="display:flex;gap:8px;align-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;padding:0 6px 6px"><svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="9" height="9" rx="2" fill="#E3A72F"/><rect x="12" y="1" width="9" height="9" rx="2" fill="#5B7DB1"/><rect x="1" y="12" width="9" height="9" rx="2" fill="#8DB580"/><rect x="12" y="12" width="9" height="9" rx="2" fill="#9C6BA8"/></svg>quilt</span>

          ${['budget', 'groceries', 'calendar', 'todos', 'workout', 'subs'].map(k => `<button type="button" class="tb${k === active ? ' on' : ''}" ${k === active ? 'aria-current="page"' : ''}><span class="patchi" style="background:${DYES[TABS[k].i]}">${icon(TABS[k].ic, 15)}</span>${TABS[k].n}${k === 'budget' && mode === 'use' ? '<span class="tag" style="margin-left:auto">just changed</span>' : ''}</button>`).join('')}
          <button type="button" class="tb" style="color:var(--denim)">${icon('i-plus', 16)}New tab</button>
          <span style="margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px;font-size:13px"><span class="patchi" style="width:28px;height:28px;border-radius:50%;background:${DYES[3]}">${icon('i-user', 15)}</span>Sam · 32 credits</span>
        </aside>`;
      if (mode === 'use') {
        const r = recent[selRow];
        device.innerHTML = `<div class="lapwrap"><div class="laptop" role="region" aria-label="Quilt on a laptop">${side('budget')}
          <div class="mainp">
            <div style="display:flex;align-items:center;gap:10px"><span class="patchi" style="background:${DYES[2]}">${icon('i-wallet')}</span><h2 class="h1">Budget</h2><span class="small">November</span><button type="button" class="ib" style="margin-left:auto" aria-label="Budget tab menu">${icon('i-more')}</button></div>
            <div style="display:grid;grid-template-columns:1.1fr 1fr;gap:14px">
              <section class="st card"><div style="display:flex;align-items:baseline;gap:8px"><span class="big">$376</span><span class="small">left of $800</span><span class="tag">just changed</span></div><div class="bar"><u style="width:53%"></u></div><span class="small">was $412 · Corner Market receipt from your phone, 12:41</span></section>
              <section class="st card">${[['Groceries', 89, 0, '$177.83 / $200'], ['Eating out', 91, 9, '$165 / $150'], ['Transport', 52, 0, '$42 / $80'], ['Subscriptions', 96, 0, '$38.46 / $40']].map(([n, w, o, v]) => `<div style="display:flex;justify-content:space-between;font-size:13px"><span>${n}</span><span class="mono">${v}</span></div><div class="bar" style="height:6px"><u style="width:${w}%"></u>${o ? `<s style="width:${o}%"></s>` : ''}</div>`).join('')}</section>
            </div>
            <div class="sect"><span>RECENT</span><span>click a row</span></div>
            <section class="st card" style="padding:6px;gap:2px">${recent.map((x, i) => `<button type="button" class="lrow${i === selRow ? ' on' : ''}" data-r="${i}"><span>${x[0]}</span><span class="small">${x[1]}</span><span>${x[2]}</span></button>`).join('')}</section>
          </div>
          <aside class="detail" aria-label="Row detail">
            <span class="sect" style="margin:0"><span>DETAIL</span></span>
            <h3 class="h2">${r[0]}</h3><span class="big" style="font-size:28px">${r[2]}</span><span class="small">${r[1]}</span>
            ${selRow === 0 ? `<div class="st card" style="gap:4px">${['Oat milk $3.49', 'Eggs, dozen $4.29', 'Bananas $1.87', 'Chicken thighs $8.62', '+ 4 more'].map(t => `<span style="font-size:13px">${t}</span>`).join('')}</div><span class="small" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">also in <i class="dot" style="background:${DYES[1]}"></i>Groceries <i class="dot" style="background:${DYES[4]}"></i>Calendar</span>` : ''}
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto"><button type="button" class="b ghost">Edit</button><button type="button" class="b ink">${icon('i-trash', 16)}Delete</button></div>
          </aside></div></div>`;
        $$('[data-r]').forEach(b => b.addEventListener('click', () => { selRow = +b.dataset.r; render(); }));
      } else {
        const L = LAYOUTS[B.layout];
        const pcs = L.pieces.map(k => ({ ...PIECE[k] }));
        device.innerHTML = `<div class="lapwrap"><div class="laptop build" role="region" aria-label="Building a tab on a laptop">
          <section class="chat" aria-label="Clair">
            <div style="display:flex;align-items:center;gap:10px">${spool('waiting', 34)}<span style="flex:1;display:flex;flex-direction:column"><b>Clair</b><span class="small">answers from your tabs only</span></span><span class="small mono">32 credits</span></div>
            <div class="bub">Track my subscriptions and warn me before they renew</div>
            <div class="chalk">${chalkOl()}<p class="say">How early should I warn you before a renewal?</p><div style="display:flex;gap:8px"><span class="chip" aria-pressed="true">3 days before</span><span class="chip">1 week before</span></div></div>
            <div class="clair">Basted 4 pieces. Here are 3 layouts.</div>
            <div style="display:grid;gap:6px">${LAYOUTS.map((l, i) => `<button type="button" class="b ${i === B.layout ? '' : 'ghost'} wide" data-l="${i}" style="justify-content:space-between">${l.name}<span class="mono" style="font-size:11px">${i + 1} of 3</span></button>`).join('')}</div>
            <form class="chalk" style="flex-direction:row;align-items:center;gap:8px;padding:6px 6px 6px 12px;margin-top:auto" onsubmit="event.preventDefault()">${chalkOl()}<input placeholder="Tell Clair a change" aria-label="Tell Clair a change" style="flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;min-height:44px;outline:none;color:var(--w-ink)"><button class="b" aria-label="Send" style="width:44px;padding:0">${icon('i-send')}</button></form>
          </section>
          <section class="prevp" aria-label="Live preview">
            <div style="display:flex;align-items:center;gap:10px"><span class="mono small">LIVE PREVIEW · ${L.name}</span><span style="margin-left:auto;display:flex;gap:8px"><button type="button" class="b ghost">${icon('i-layout')}Arrange</button><button type="button" class="b">Stitch it in</button></span></div>
            <div class="frame">
              <div style="display:flex;align-items:center;gap:10px"><span class="patchi" style="background:${DYES[5]}">${icon('i-repeat')}</span><h2 class="h1" style="font-size:26px">Subscriptions</h2></div>
              <p class="small" style="margin:0">Example rows · cleared when you stitch it in</p>
              ${pcs.map(pieceCard).join('')}
            </div>
          </section></div></div>`;
        $$('[data-l]').forEach(b => b.addEventListener('click', () => { B.layout = +b.dataset.l; render(); }));
      }
    };
    render();
    setNotes(`
      <h2>Laptop</h2>
      <p>Same components, wider. This is the screen beside the phone in the demo.</p>
      <ol class="beats">
        <li><span class="n">a</span><span><b>Using a tab:</b> tab list | open tab | row detail. ⌘K opens the same search. <span class="dec">Q30</span></span></li>
        <li><span class="n">b</span><span><b>Live update:</b> when the phone stitches the receipt, Budget here gets the "just changed" tag. The thread pull plays only on the phone that acted. <span class="dec">Q17</span></span></li>
        <li><span class="n">c</span><span><b>Building:</b> Clair's conversation left (question, layouts, tell-Clair field), live preview right, with Arrange and Stitch it in.</span></li>
      </ol>
      <div class="try"><b>Try:</b> click Recent rows to change the detail panel; switch to "Building a tab" and pick a layout on the left.</div>`);
  }

  /* ---------- wiring ---------- */
  let current = 'build';
  function pick(sc) {
    current = sc; runId++;
    $$('[data-sc]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.sc === sc)));
    stage.classList.toggle('wide', sc === 'laptop');
    if (sc === 'build') { setNotes(BUILD_NOTES(), B.step); buildSub(); goStep(B.step); }
    else if (sc === 'stitched') stitched();
    else if (sc === 'search') search();
    else if (sc === 'rows') rows();
    else if (sc === 'settings') settings();
    else laptop();
  }
  $$('[data-sc]').forEach(b => b.addEventListener('click', () => pick(b.dataset.sc)));
  pick('build');
})();
</script>
