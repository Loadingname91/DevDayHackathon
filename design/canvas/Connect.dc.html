<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#EEF6F1"><meta name="color-scheme" content="light">
<title>New app: connect and add</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&amp;display=swap">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1);--ease-thread:cubic-bezier(.45,0,.15,1);--t-fb:120ms;--t-state:220ms;--t-layout:350ms;--t-focal:600ms;--t-state-out:140ms;--t-layout-out:220ms;--t-focal-out:360ms}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
body{margin:0}
a{color:#221F3A;text-decoration:none}
@media (hover:hover) and (pointer:fine){a:hover{color:#5B5775}a.lk:hover{color:#2F56B0}}
button{font:inherit;cursor:pointer;color:inherit}
button,a,[role="button"]{touch-action:manipulation}
input,textarea,select{font-size:16px}
.pb,.qp,.chip,.grip,.swrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chips{overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.chips>*{scroll-snap-align:start}
.btn,.chip,.qp{transition:transform var(--t-fb) var(--ease)}
.btn:active,.chip:active{transform:scale(.97)}
.qp:active{transform:scale(.98)}
.pb{transition:box-shadow var(--t-fb) var(--ease)}
.pb:active{box-shadow:inset 0 0 0 100px rgba(34,31,58,.07)!important}
.rw{transition:background-color var(--t-fb) var(--ease)}
.rw:active{background-color:#EAF3EE!important}
.scr{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent)}
.lk{font:600 15px 'Figtree',system-ui,sans-serif;color:#263F8C;text-decoration:none;min-height:44px;min-width:44px;justify-content:center;display:inline-flex;align-items:center;gap:4px}
.num{font-variant-numeric:tabular-nums}
.qp{border-radius:22px;box-shadow:0 12px 28px -18px rgba(20,30,40,.4)}
body{font-variant-numeric:tabular-nums}
::selection{background:#C9F0DE;color:#221F3A}
a:focus-visible,button:focus-visible{outline:3px solid #2F56B0;outline-offset:3px}
.st{background-color:rgba(255,255,255,.78);border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 12px 28px -16px rgba(20,30,40,.32);transition:outline-color var(--t-state) var(--ease);outline:1.5px solid transparent;outline-offset:-7px}
.st.basted{outline:1.5px dashed rgba(34,31,58,.42)}
.chalk{position:relative;background:rgba(53,87,166,0.06);border-radius:22px;outline:2px dotted rgba(53,87,166,0.7);outline-offset:-3px}
@media (prefers-reduced-motion:reduce){.btn,.chip,.qp,.pb,.rw,.btn:active,.chip:active,.qp:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #EEF6F1; background-image: radial-gradient(75% 46% at 100% 0%, rgba(201,240,222,0.5) 0%, transparent 72%), radial-gradient(75% 46% at 0% 22%, rgba(221,235,255,0.5) 0%, transparent 72%), radial-gradient(75% 46% at 100% 60%, rgba(255,240,196,0.5) 0%, transparent 72%), radial-gradient(75% 46% at 0% 100%, rgba(207,239,240,0.5) 0%, transparent 72%); color: #221F3A; font-family: 'Figtree', system-ui, sans-serif;">
  <div class="scr" style="position: absolute; inset: 0 0 100px 0; overflow-y: auto; padding: 44px 16px 24px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px;"><a href="Preview.dc.html" aria-label="Back to preview" style="width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#221F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><h1 style="margin: 0; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.005em;">Add to my apps</h1><span style="width: 44px;"></span></div>
    <section class="st" style="padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;"><div style="display: flex; gap: 12px; align-items: center;"><span style="width: 48px; height: 48px; border-radius: 16px; background: #B1E5EE; display: grid; place-items: center; flex: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l3 3-3 3M4 12V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 12v3a3 3 0 0 1-3 3H4"></path></svg></span><label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5B5775;">Name<input value="Subscriptions" autocapitalize="words" enterkeyhint="done" style="min-height: 44px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #B4B0CC; padding: 0 12px; font: inherit; font-size: 16px; color: #221F3A;"></label></div><div role="radiogroup" aria-label="Colour" style="display: flex; gap: 8px; flex-wrap: wrap;"><span role="radio" aria-checked="false" aria-label="butter" style="width: 32px; height: 32px; border-radius: 50%; background: #FFE48F; box-shadow: inset 0 0 0 1px rgba(34,31,58,0.2); margin: 6px 2px;"></span><span role="radio" aria-checked="false" aria-label="sage" style="width: 32px; height: 32px; border-radius: 50%; background: #FFC8AC; box-shadow: inset 0 0 0 1px rgba(34,31,58,0.2); margin: 6px 2px;"></span><span role="radio" aria-checked="false" aria-label="sea glass" style="width: 32px; height: 32px; border-radius: 50%; background: #B5EBD0; box-shadow: inset 0 0 0 1px rgba(34,31,58,0.2); margin: 6px 2px;"></span><span role="radio" aria-checked="false" aria-label="apricot" style="width: 32px; height: 32px; border-radius: 50%; background: #FFBFD4; box-shadow: inset 0 0 0 1px rgba(34,31,58,0.2); margin: 6px 2px;"></span><span role="radio" aria-checked="false" aria-label="chambray" style="width: 32px; height: 32px; border-radius: 50%; background: #BDD5FF; box-shadow: inset 0 0 0 1px rgba(34,31,58,0.2); margin: 6px 2px;"></span><span role="radio" aria-checked="true" aria-label="lavender" style="width: 32px; height: 32px; border-radius: 50%; background: #B1E5EE; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #221F3A; margin: 6px 2px;"></span><span role="radio" aria-checked="false" aria-label="pear" style="width: 32px; height: 32px; border-radius: 50%; background: #CFC3FF; box-shadow: inset 0 0 0 1px rgba(34,31,58,0.2); margin: 6px 2px;"></span><span role="radio" aria-checked="false" aria-label="blush" style="width: 32px; height: 32px; border-radius: 50%; background: #EAD8BD; box-shadow: inset 0 0 0 1px rgba(34,31,58,0.2); margin: 6px 2px;"></span></div></section>
    <div style="display: flex; justify-content: space-between; gap: 8px; font-family: 'Figtree', system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0; color: #5B5775;"><span>Connect to your other apps</span><span style="font-weight: 500;">Clair's picks</span></div>
    <section class="st" style="padding: 4px 8px 4px 16px;">
      <sc-for list="{{ conns }}" as="c" hint-placeholder-count="3">
        <div style="{{ c.row }}"><span style="{{ c.chip }}"></span><span style="flex: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; font-weight: 500; color: #221F3A;">{{ c.t }}</span><span style="font-size: 13px; color: #5B5775;">{{ c.s }}</span></span>
          <button type="button" role="switch" aria-checked="{{ c.on }}" aria-label="{{ c.t }}" onClick="{{ c.toggle }}" style="{{ c.sw }}"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF;"></span></button></div>
      </sc-for>
    </section>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px;"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #2F56B0;"> Keep the example rows</label>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px;"><a class="btn" href="Empty.dc.html" style="min-height: 48px; padding: 0 20px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: transparent; box-shadow: inset 0 0 0 1.5px #B4B0CC; color: #221F3A;">Skip</a><a class="btn" href="Empty.dc.html" style="min-height: 48px; padding: 0 20px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: #221F3A; color: #FFFFFF;">Add to my apps</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { off: { 2: true } }; }
  renderVals() {
    var self = this, st = this.state;
    var conns = [['Renewal dates → Calendar', 'Each renewal shows on its day, 3 days warning', '#BDD5FF'], ['Cost → Budget', 'Counts in Subscriptions ($40 cap)', '#B5EBD0'], ['Unused 30 days → Home', 'Clair suggests cancelling what you don\u2019t open', '#FFE48F']].map(function (c, i) {
      var on = !st.off[i];
      return { t: c[0], s: c[1], on: on ? 'true' : 'false', toggle: function () { var o = Object.assign({}, st.off); o[i] = on; self.setState({ off: o }); },
        row: 'display: flex; align-items: center; gap: 12px; min-height: 64px;' + (i ? ' background-image: linear-gradient(90deg, #B4B0CC 58%, transparent 0); background-size: 8px 1px; background-repeat: repeat-x;' : ''),
        chip: 'flex: none; width: 28px; height: 28px; border-radius: 12px; background: ' + c[2] + ';',
        sw: 'flex: none; width: 60px; height: 44px; padding: 9px 4px; border: 0; background: transparent; display: flex; ' + (on ? 'justify-content: flex-end;' : 'justify-content: flex-start;') + ' align-items: center; border-radius: 22px; box-shadow: inset 0 0 0 50px ' + (on ? '#2F56B0' : '#B4B0CC') + '; background-clip: content-box;' };
    });
    return { conns: conns };
  }
}
</script>
</body>
</html>
