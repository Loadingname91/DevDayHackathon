<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F4EEE1"><meta name="color-scheme" content="light">
<title>What slips for you?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=DM+Mono:wght@400;500&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1);--ease-thread:cubic-bezier(.45,0,.15,1);--t-fb:120ms;--t-state:220ms;--t-layout:350ms;--t-focal:600ms;--t-state-out:140ms;--t-layout-out:220ms;--t-focal-out:360ms}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
body{margin:0}
a{color:#2A2119;text-decoration:none}
@media (hover:hover) and (pointer:fine){a:hover{color:#665847}a.lk:hover{color:#3557A6}}
button{font:inherit;cursor:pointer;color:inherit}
button,a,[role="button"]{touch-action:manipulation}
input,textarea,select{font-size:16px}
.pb,.qp,.chip,.grip,.swrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chips{overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.chips>*{scroll-snap-align:start}
.btn,.chip,.qp{transition:transform var(--t-fb) var(--ease)}
.btn:active,.chip:active{transform:scale(.97)}
.qp:active{transform:scale(.98)}
.pb{transition:box-shadow var(--t-fb) var(--ease)}
.pb:active{box-shadow:inset 0 0 0 100px rgba(42,33,25,.07)!important}
.rw{transition:background-color var(--t-fb) var(--ease)}
.rw:active{background-color:#F7F1E6!important}
.scr{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent)}
.lk{font:600 15px 'Hanken Grotesk',system-ui,sans-serif;color:#22396F;text-decoration:none;min-height:44px;min-width:44px;justify-content:center;display:inline-flex;align-items:center;gap:4px}
.num{font-variant-numeric:tabular-nums}
.st{background-color:#FFFDF8;border-radius:16px;background-image:linear-gradient(90deg,#BFAE90 58%,transparent 0),linear-gradient(90deg,#BFAE90 58%,transparent 0),linear-gradient(0deg,#BFAE90 58%,transparent 0),linear-gradient(0deg,#BFAE90 58%,transparent 0);background-size:7px 1.5px,7px 1.5px,1.5px 7px,1.5px 7px;background-position:0 5px,0 calc(100% - 5px),5px 0,calc(100% - 5px) 0;background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;transition:background-size var(--t-state) var(--ease)}
.st.basted{background-image:linear-gradient(90deg,#665847 62%,transparent 0),linear-gradient(90deg,#665847 62%,transparent 0),linear-gradient(0deg,#665847 62%,transparent 0),linear-gradient(0deg,#665847 62%,transparent 0);background-size:20px 1.5px,20px 1.5px,1.5px 20px,1.5px 20px;transition-duration:var(--t-state-out)}
.chalk{position:relative;background:rgba(53,87,166,0.06);border-radius:16px;outline:2px dotted rgba(53,87,166,0.7);outline-offset:-3px}
@media (prefers-reduced-motion:reduce){.btn,.chip,.qp,.pb,.rw,.st{transition:none}.btn:active,.chip:active,.qp:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4EEE1; color: #2A2119; font-family: 'Hanken Grotesk', system-ui, sans-serif;">
  <div class="scr" style="position: absolute; inset: 0 0 140px 0; overflow-y: auto; padding: 44px 16px 24px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px;"><a href="OnWelcome.dc.html" aria-label="Back to Welcome" style="width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2119" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><span style="width: 44px;"></span></div>
    <div style="display: flex; gap: 12px; align-items: center;"><svg class="sp" width="44" height="45" viewBox="-6 -10 68 70" aria-hidden="true" style="flex: none; overflow: visible;"><path d="M14 38 C8 40 5 43 0 45" fill="none" stroke="#2A2119" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><rect x="10" y="6" width="36" height="8" rx="3" fill="#D9B98F" stroke="#2A2119" stroke-width="2.6"></rect><rect x="14" y="14" width="28" height="28" fill="#3557A6" stroke="#2A2119" stroke-width="2.6"></rect><rect x="10" y="42" width="36" height="8" rx="3" fill="#D9B98F" stroke="#2A2119" stroke-width="2.6"></rect><circle cx="23" cy="26" r="3.2" fill="#FFFFFF"></circle><circle cx="33" cy="26" r="3.2" fill="#FFFFFF"></circle><path d="M24 31 q4 3 8 0" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.025em; line-height: 1.05;">What slips for you?</h1></div>
    <div role="group" aria-label="What slips" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;"><sc-for list="{{ chips }}" as="c" hint-placeholder-count="6"><button type="button" class="chip" onClick="{{ c.pick }}" aria-pressed="{{ c.on }}" style="{{ c.style }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="{{ c.icon }}"></path></svg>{{ c.n }}</button></sc-for></div>
    <p style="margin: 0; font-size: 15px; color: #665847;">Pick any. You can add more later.</p>
    <sc-if value="{{ some }}" hint-placeholder-val="{{ false }}"><section class="st" style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;"><span style="font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0; color: #665847;">Clair makes</span><span style="font-size: 16px; line-height: 1.45;">{{ makes }}</span><span style="font-size: 13px; color: #665847;">Calendar comes with every set, since they all have dates.</span></section></sc-if>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: max(24px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px;"><sc-if value="{{ some }}" hint-placeholder-val="{{ false }}"><a class="btn" href="OnMaking.dc.html" style="min-height: 48px; padding: 0 20px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: #3557A6; color: #FFFFFF;">Make my apps</a></sc-if><sc-if value="{{ none }}" hint-placeholder-val="{{ true }}"><button class="btn" type="button" aria-disabled="true" style="min-height: 48px; padding: 0 20px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: #3557A6; color: #FFFFFF; opacity: 0.45;">Make my apps</button></sc-if><a class="btn" href="Welcome.dc.html" style="min-height: 48px; padding: 0 20px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: transparent; box-shadow: inset 0 0 0 1.5px #BFAE90; color: #2A2119;">Skip</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: {} }; }
  renderVals() {
    var self = this, st = this.state;
    var S = [["Money", "M3 7h18v12H3zM3 10h18M16 15h2"], ["Groceries", "M3 4h2l2.2 10.5h10.6L20 7H6.2M9 19.5h.01M17 19.5h.01"], ["Classes", "M5 5h12v15H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h10"], ["Workouts", "M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"], ["Subscriptions", "M17 3l3 3-3 3M4 12V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 12v3a3 3 0 0 1-3 3H4"], ["To-dos", "M5 12.5l4.5 4.5L19 7"]];
    var chips = S.map(function (c) {
      var on = !!st.on[c[0]];
      return { n: c[0], icon: c[1], on: on ? 'true' : 'false', pick: function () { var o = Object.assign({}, st.on); o[c[0]] = !on; self.setState({ on: o }); },
        style: 'min-height: 56px; padding: 0 12px; border: 0; border-radius: 12px; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; ' + (on ? 'background: #E6ECF7; box-shadow: inset 0 0 0 1.5px #3557A6; color: #22396F;' : 'background: #FFFDF8; box-shadow: inset 0 0 0 1.5px #BFAE90; color: #2A2119;') };
    });
    // chip -> template (onboarding.md 2.2): Money and Subscriptions make one app; Calendar always
    var apps = [];
    if (st.on.Money || st.on.Subscriptions) apps.push('Budget & subscriptions');
    [['Groceries', 'Groceries'], ['Classes', 'Classes'], ['Workouts', 'Workout'], ['To-dos', 'To-dos']].forEach(function (m) { if (st.on[m[0]]) apps.push(m[1]); });
    var some = apps.length > 0;
    if (some) apps.push('Calendar');
    return { chips: chips, some: some, none: !some, makes: apps.slice(0, -1).join(', ') + ' and ' + apps[apps.length - 1] };
  }
}
</script>
</body>
</html>
