<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F4EEE1"><meta name="color-scheme" content="light">
<title>Review receipt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=DM+Mono:wght@400;500&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1);--ease-thread:cubic-bezier(.45,0,.15,1);--t-fb:120ms;--t-state:220ms;--t-layout:350ms;--t-focal:600ms;--t-state-out:140ms;--t-layout-out:220ms;--t-focal-out:360ms}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
body{margin:0}
a{color:#2A2119;text-decoration:none}
@media (hover:hover) and (pointer:fine){a:hover{color:#665847}a.lk:hover{color:#3557A6}}
button{font:inherit;cursor:pointer;color:inherit}
button,a,[role="button"]{touch-action:manipulation}
input,textarea,select{font-size:16px}
.pb,.qp,.chip,.grip,.swrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chips{overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.chips>*{scroll-snap-align:start}
.btn,.chip,.qp{transition:transform var(--t-fb) var(--ease)}
.btn:active,.chip:active{transform:scale(.97)}
.qp:active{transform:scale(.98)}
.pb{transition:box-shadow var(--t-fb) var(--ease)}
.pb:active{box-shadow:inset 0 0 0 100px rgba(42,33,25,.07)!important}
.rw{transition:background-color var(--t-fb) var(--ease)}
.rw:active{background-color:#F7F1E6!important}
.scr{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent)}
.lk{font:600 15px 'Hanken Grotesk',system-ui,sans-serif;color:#22396F;text-decoration:none;min-height:44px;min-width:44px;justify-content:center;display:inline-flex;align-items:center;gap:4px}
.num{font-variant-numeric:tabular-nums}
.st{background-color:#FFFDF8;border-radius:16px;background-image:linear-gradient(90deg,#BFAE90 58%,transparent 0),linear-gradient(90deg,#BFAE90 58%,transparent 0),linear-gradient(0deg,#BFAE90 58%,transparent 0),linear-gradient(0deg,#BFAE90 58%,transparent 0);background-size:7px 1.5px,7px 1.5px,1.5px 7px,1.5px 7px;background-position:0 5px,0 calc(100% - 5px),5px 0,calc(100% - 5px) 0;background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;transition:background-size var(--t-state) var(--ease)}
.st.basted{background-image:linear-gradient(90deg,#665847 62%,transparent 0),linear-gradient(90deg,#665847 62%,transparent 0),linear-gradient(0deg,#665847 62%,transparent 0),linear-gradient(0deg,#665847 62%,transparent 0);background-size:20px 1.5px,20px 1.5px,1.5px 20px,1.5px 20px;transition-duration:var(--t-state-out)}
.chalk{position:relative;background:rgba(53,87,166,0.06);border-radius:16px;outline:2px dotted rgba(53,87,166,0.7);outline-offset:-3px}
@media (prefers-reduced-motion:reduce){.btn,.chip,.qp,.pb,.rw,.st{transition:none}.btn:active,.chip:active,.qp:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4EEE1; color: #2A2119; font-family: 'Hanken Grotesk', system-ui, sans-serif;">
  <div class="scr" style="position: absolute; inset: 0 0 104px 0; overflow-y: auto; padding: 44px 16px 24px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 16px;">
    <a href="Groceries.dc.html" aria-label="Back to Groceries" style="width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2119" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; gap: 16px; align-items: center;">
      <svg width="54" height="76" viewBox="0 0 44 62" aria-hidden="true" style="flex: none; transform: rotate(-4deg);"><path d="M2 2h40v54l-4-3-4 3-4-3-4 3-4-3-4 3-4-3-4 3-4-3-4 3z" fill="#FFFFFF" stroke="#BFAE90" stroke-width="1.2"></path><path d="M8 10h20M8 16h28M8 21h24M8 26h28M8 31h18M8 36h26M8 44h28" stroke="#665847" stroke-width="1.4" stroke-linecap="round"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0; color: #665847;">Receipt photo · today 5:41&nbsp;pm</span>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.025em; line-height: 1.05;">Corner Market</h1>
        <span style="font-size: 15px; font-variant-numeric: tabular-nums;">{{ count }} of 8 items · {{ total }}</span>
      </div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; color: #22396F;">
      <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}"><svg class="sp" width="44" height="45" viewBox="-6 -10 68 70" aria-hidden="true" style="flex: none; overflow: visible;"><path d="M14 38 C8 40 5 43 0 45" fill="none" stroke="#2A2119" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><rect x="10" y="6" width="36" height="8" rx="3" fill="#D9B98F" stroke="#2A2119" stroke-width="2.6"></rect><rect x="14" y="14" width="28" height="28" fill="#3557A6" stroke="#2A2119" stroke-width="2.6"></rect><rect x="10" y="42" width="36" height="8" rx="3" fill="#D9B98F" stroke="#2A2119" stroke-width="2.6"></rect><circle cx="23" cy="26" r="3.2" fill="#FFFFFF"></circle><circle cx="33" cy="26" r="3.2" fill="#FFFFFF"></circle><path d="M20.5 21 q2.5 -2 5 0 M30.5 21 q2.5 -2 5 0" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M25 31.5 q3 2 6 0" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M41 9 L55 -5 L57 -7 L55 -3 Z" fill="#C9CCD1" stroke="#2A2119" stroke-width="1.2" stroke-linejoin="round"></path><path d="M54 -4 C60 -3 62 3 58 9" fill="none" stroke="#E3A72F" stroke-width="1.5" stroke-linecap="round"></path></svg></sc-if><sc-if value="{{ done }}" hint-placeholder-val="{{ false }}"><svg class="sp" width="44" height="45" viewBox="-6 -10 68 70" aria-hidden="true" style="flex: none; overflow: visible;"><path d="M14 38 C8 40 5 43 0 45" fill="none" stroke="#2A2119" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><rect x="10" y="6" width="36" height="8" rx="3" fill="#D9B98F" stroke="#2A2119" stroke-width="2.6"></rect><rect x="14" y="14" width="28" height="28" fill="#3557A6" stroke="#2A2119" stroke-width="2.6"></rect><rect x="10" y="42" width="36" height="8" rx="3" fill="#D9B98F" stroke="#2A2119" stroke-width="2.6"></rect><path d="M20.5 27 q2.5 -3.5 5 0 M30.5 27 q2.5 -3.5 5 0" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M23.5 30.5 q4.5 4.5 9 0" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M46 2l3 3 6-7" fill="none" stroke="#2A2119" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
      <span>{{ clairLine }}</span>
    </div>
    <section class="{{ listClass }}" aria-label="Items read from the receipt" style="padding: 4px;">
      <sc-for list="{{ items }}" as="i" hint-placeholder-count="8">
        <button class="rw" type="button" onClick="{{ i.toggle }}" aria-pressed="{{ i.on }}" style="{{ i.style }}">
          <span aria-hidden="true" style="{{ i.box }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column; text-align: left;"><span style="font-size: 16px; font-weight: 500;">{{ i.name }}</span><span style="font-size: 13px; color: #665847;">{{ i.note }}</span></span>
          <span style="font-family: 'DM Mono', monospace; font-size: 14px; font-variant-numeric: tabular-nums;">{{ i.price }}</span>
        </button>
      </sc-for>
    </section>
    <div style="display: flex; justify-content: space-between; gap: 8px; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0; color: #665847;"><span>Adding updates 3 apps</span></div>
    <section class="st" style="padding: 4px 16px;">
      <sc-for list="{{ effects }}" as="e" hint-placeholder-count="3">
        <a class="rw" href="{{ e.href }}" style="display: flex; align-items: center; gap: 12px; min-height: 56px;">
          <span aria-hidden="true" style="{{ e.dot }}"></span>
          <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; font-weight: 500; color: #2A2119;">{{ e.app }}</span><span style="font-size: 13px; color: #665847; font-variant-numeric: tabular-nums;">{{ e.what }}</span></span>
          <sc-if value="{{ e.changed }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 600; padding: 2px 8px; background: #E3A72F; color: #1F180D; border-radius: 4px; white-space: nowrap;">just changed</span></sc-if>
        </a>
      </sc-for>
    </section>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; gap: 8px;">
    <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
      <a class="btn" href="Main.dc.html" style="flex: 1; min-height: 48px; padding: 0 20px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: transparent; box-shadow: inset 0 0 0 1.5px #BFAE90; color: #2A2119;">Not now</a>
      <button class="btn" type="button" onClick="{{ add }}" style="flex: 1.6; min-height: 48px; padding: 0 20px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: #3557A6; color: #FFFFFF;">Add to 3 apps</button>
    </sc-if>
    <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <button class="btn" type="button" onClick="{{ undo }}" style="flex: 1; min-height: 48px; padding: 0 20px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: transparent; box-shadow: inset 0 0 0 1.5px #BFAE90; color: #2A2119;">Undo</button>
      <a class="btn" href="Budget.dc.html" style="flex: 1.6; min-height: 48px; padding: 0 20px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: #3557A6; color: #FFFFFF;">See Budget ›</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { off: {}, done: false }; }
  renderVals() {
    var self = this, st = this.state;
    var raw = [['Oat milk', '1 carton', 3.49], ['Eggs, dozen', '12', 4.29], ['Bananas', '1 bunch', 1.87], ['Chicken thighs', '2 lb · use by Tue', 8.62], ['Rice, 5 lb', '1 bag', 6.99], ['Spinach', '1 bag · use by Tue', 3.29], ['Greek yogurt', '32 oz', 4.29], ['Coffee beans', '12 oz', 2.99]];
    var total = 0, count = 0;
    var items = raw.map(function (r, i) {
      var on = !st.off[i];
      if (on) { total += r[2]; count++; }
      return { name: r[0], note: r[1], price: '$' + r[2].toFixed(2), on: on ? 'true' : 'false',
        toggle: function () { if (st.done) return; var o = Object.assign({}, st.off); o[i] = on; self.setState({ off: o }); },
        style: 'width: 100%; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border: 0; background: transparent; text-align: left;' + (i ? ' background-image: linear-gradient(90deg, #BFAE90 58%, transparent 0); background-size: 8px 1px; background-repeat: repeat-x;' : '') + (on ? '' : ' color: #665847;'),
        box: 'flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; ' + (on ? 'background: #1F6B5E;' : 'background: transparent; box-shadow: inset 0 0 0 1.5px #665847;') };
    });
    var left = 412 - total;
    var dot = function (c) { return 'flex: none; width: 12px; height: 12px; border-radius: 50%; background: ' + c + '; box-shadow: inset 0 0 0 1.5px rgba(42,33,25,0.45);'; };
    return {
      items: items, count: count, total: '$' + total.toFixed(2), done: st.done, notDone: !st.done,
      listClass: st.done ? 'st' : 'st basted',
      clairLine: st.done ? 'Added. Groceries, Budget and Calendar are up to date.' : 'I read 8 items. Untick anything wrong, then add.',
      effects: [
        { app: 'Groceries', what: 'Check off ' + count + ' items on your list', href: 'Groceries.dc.html', dot: dot('#DDEBD2'), changed: st.done },
        { app: 'Budget', what: '$412 → $' + Math.round(left) + ' left this month', href: 'Budget.dc.html', dot: dot('#D3ECE7'), changed: st.done },
        { app: 'Calendar', what: 'Use the chicken and spinach by Tue 24 Nov', href: 'Calendar.dc.html', dot: dot('#DCE4F3'), changed: st.done }
      ],
      add: function () { self.setState({ done: true }); },
      undo: function () { self.setState({ done: false }); }
    };
  }
}
</script>
</body>
</html>
