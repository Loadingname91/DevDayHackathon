<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F4EEE1"><meta name="color-scheme" content="light">
<title>To-dos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=DM+Mono:wght@400;500&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1);--ease-thread:cubic-bezier(.45,0,.15,1);--t-fb:120ms;--t-state:220ms;--t-layout:350ms;--t-focal:600ms;--t-state-out:140ms;--t-layout-out:220ms;--t-focal-out:360ms}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
body{margin:0}
a{color:#2A2119;text-decoration:none}
@media (hover:hover) and (pointer:fine){a:hover{color:#665847}a.lk:hover{color:#3557A6}}
button{font:inherit;cursor:pointer;color:inherit}
button,a,[role="button"]{touch-action:manipulation}
input,textarea,select{font-size:16px}
.pb,.qp,.chip,.grip,.swrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chips{overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.chips>*{scroll-snap-align:start}
.btn,.chip,.qp{transition:transform var(--t-fb) var(--ease)}
.btn:active,.chip:active{transform:scale(.97)}
.qp:active{transform:scale(.98)}
.pb{transition:box-shadow var(--t-fb) var(--ease)}
.pb:active{box-shadow:inset 0 0 0 100px rgba(42,33,25,.07)!important}
.rw{transition:background-color var(--t-fb) var(--ease)}
.rw:active{background-color:#F7F1E6!important}
.scr{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent)}
.lk{font:600 15px 'Hanken Grotesk',system-ui,sans-serif;color:#22396F;text-decoration:none;min-height:44px;min-width:44px;justify-content:center;display:inline-flex;align-items:center;gap:4px}
.num{font-variant-numeric:tabular-nums}
.st{background-color:#FFFDF8;border-radius:16px;background-image:linear-gradient(90deg,#BFAE90 58%,transparent 0),linear-gradient(90deg,#BFAE90 58%,transparent 0),linear-gradient(0deg,#BFAE90 58%,transparent 0),linear-gradient(0deg,#BFAE90 58%,transparent 0);background-size:7px 1.5px,7px 1.5px,1.5px 7px,1.5px 7px;background-position:0 5px,0 calc(100% - 5px),5px 0,calc(100% - 5px) 0;background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;transition:background-size var(--t-state) var(--ease)}
.st.basted{background-image:linear-gradient(90deg,#665847 62%,transparent 0),linear-gradient(90deg,#665847 62%,transparent 0),linear-gradient(0deg,#665847 62%,transparent 0),linear-gradient(0deg,#665847 62%,transparent 0);background-size:20px 1.5px,20px 1.5px,1.5px 20px,1.5px 20px;transition-duration:var(--t-state-out)}
.chalk{position:relative;background:rgba(53,87,166,0.06);border-radius:16px;outline:2px dotted rgba(53,87,166,0.7);outline-offset:-3px}
@media (prefers-reduced-motion:reduce){.btn,.chip,.qp,.pb,.rw,.st{transition:none}.btn:active,.chip:active,.qp:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4EEE1; color: #2A2119; font-family: 'Hanken Grotesk', system-ui, sans-serif;">
  <div class="scr" style="position: absolute; inset: 0 0 150px 0; overflow-y: auto; padding: 44px 16px 24px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 16px;">
    <a href="Main.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2119" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;"><span style="width: 36px; height: 36px; border-radius: 8px; background: #FBEBC4; display: grid; place-items: center; flex: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2119" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span><h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.025em; line-height: 1.05;">To-dos</h1></div>
    <p style="margin: 0; font-size: 16px;"><b>{{ left }}</b> left today.</p>
    <div style="display: flex; justify-content: space-between; gap: 8px; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0; color: #665847;"><span>Today · Fri 20 Nov</span></div>
    <section class="st" style="padding: 4px 0;">
      <sc-for list="{{ items }}" as="i" hint-placeholder-count="4">
        <button class="rw" type="button" onClick="{{ i.toggle }}" aria-pressed="{{ i.done }}" style="{{ i.style }}"><span aria-hidden="true" style="{{ i.box }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; text-align: left;"><span style="{{ i.nameStyle }}">{{ i.t }}</span><span style="font-size: 13px; color: #665847;">{{ i.s }}</span></span><sc-if value="{{ i.late }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: #2A2119; color: #FBF6EC; white-space: nowrap;">Overdue · 2 days</span></sc-if></button>
      </sc-for>
    </section>
    <div style="display: flex; justify-content: space-between; gap: 8px; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0; color: #665847;"><span>This week</span></div>
    <section class="st" style="padding: 4px 16px;"><a class="rw" href="Preview.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px;"><span style="flex: 1; display: flex; flex-direction: column; min-width: 0;"><span style="font-size: 16px; font-weight: 500; color: #2A2119;">Start CS 3500 project</span><span style="font-size: 13px; color: #665847;">Due Mon 23 Nov · from Classes</span></span></a><div style="display: flex; align-items: center; gap: 12px; min-height: 56px; background-image: linear-gradient(90deg, #BFAE90 58%, transparent 0); background-size: 8px 1px; background-repeat: repeat-x;"><span style="flex: 1; display: flex; flex-direction: column; min-width: 0;"><span style="font-size: 16px; font-weight: 500; color: #2A2119;">Call home</span><span style="font-size: 13px; color: #665847;">Sun 22 Nov</span></span></div></section>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 96px; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 4px 0 16px; border-radius: 12px; background: #FFFDF8; box-shadow: inset 0 0 0 1.5px #BFAE90; font-size: 16px; color: #665847;">Add a to-do, like "email TA Friday"<span style="margin-left: auto; width: 40px; height: 40px; border-radius: 50%; background: #3557A6; color: #FFFFFF; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span></div>
  <nav aria-label="Pinned apps and Clair" style="position: absolute; left: 12px; right: 12px; bottom: max(18px, env(safe-area-inset-bottom, 0px)); height: 62px; display: flex; border-radius: 16px; box-shadow: 0 8px 22px -14px rgba(42,33,25,0.55);">
    <a class="pb" href="Budget.dc.html" aria-label="Budget" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #D3ECE7; border-radius: 16px 0 0 16px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v12H3zM3 10h18M16 15h2"></path></svg><span style="font-size: 13px; font-weight: 600; letter-spacing: 0; white-space: nowrap;">Budget</span></a>
    <a class="pb" href="Groceries.dc.html" aria-label="Groceries" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #DDEBD2; border-left: 1.5px dashed rgba(42,33,25,0.4);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 10.5h10.6L20 7H6.2M9 19.5h.01M17 19.5h.01"></path></svg><span style="font-size: 13px; font-weight: 600; letter-spacing: 0; white-space: nowrap;">Groceries</span></a>
    <a class="pb" href="Calendar.dc.html" aria-label="Calendar" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #DCE4F3; border-left: 1.5px dashed rgba(42,33,25,0.4);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"></path></svg><span style="font-size: 13px; font-weight: 600; letter-spacing: 0; white-space: nowrap;">Calendar</span></a>
    <a class="pb" href="Todos.dc.html" aria-label="To-dos" aria-current="page" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #FBEBC4; border-left: 1.5px dashed rgba(42,33,25,0.4); box-shadow: inset 0 -3px 0 #3557A6;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg><span style="font-size: 13px; font-weight: 600; letter-spacing: 0; white-space: nowrap;">To-dos</span></a>
    <a class="pb" role="button" href="ClairSheet.dc.html" aria-label="Clair: type, talk or add a photo. Hold to talk" style="position: relative; overflow: hidden; flex: 0 0 64px; background: #2A2119; color: #FBF6EC; border-radius: 0 16px 16px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FBF6EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v3.5H5zM5 17.5h14V21H5zM7.5 6.5v11M16.5 6.5v11M7.5 11l9-2M7.5 15l9-2M7.5 15.5C4.8 16 3.2 18 2.2 21.5"></path></svg><span style="font-size: 13px; font-weight: 600; letter-spacing: 0; white-space: nowrap; color: #FBF6EC;">Clair</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { done: { 2: true } }; }
  renderVals() {
    var self = this, st = this.state, left = 0;
    var raw = [['Return library books', 'Marriott Library', true], ['DevDay demo at 3\u00a0pm', 'Lassonde Studios', false], ['Book flu shot', 'Student health', false], ['Pay Sam back for pizza', '$14 · Budget', false]];
    var items = raw.map(function (r, i) {
      var d = !!st.done[i]; if (!d) left++;
      return { t: r[0], s: r[1], late: r[2] && !d, done: d ? 'true' : 'false', toggle: function () { var o = Object.assign({}, st.done); o[i] = !d; self.setState({ done: o }); },
        style: 'width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; border: 0; background: transparent;' + (i ? ' background-image: linear-gradient(90deg, #BFAE90 58%, transparent 0); background-size: 8px 1px; background-repeat: repeat-x;' : ''),
        box: 'flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; ' + (d ? 'background: #1F6B5E;' : 'box-shadow: inset 0 0 0 1.5px #665847;'),
        nameStyle: 'font-size: 16px; font-weight: 500;' + (d ? ' text-decoration: line-through; color: #665847;' : '') };
    });
    return { items: items, left: left };
  }
}
</script>
</body>
</html>
