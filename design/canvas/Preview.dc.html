<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#EEF6F1"><meta name="color-scheme" content="light">
<title>New app: preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&amp;display=swap">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1);--ease-thread:cubic-bezier(.45,0,.15,1);--t-fb:120ms;--t-state:220ms;--t-layout:350ms;--t-focal:600ms;--t-state-out:140ms;--t-layout-out:220ms;--t-focal-out:360ms}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
body{margin:0}
a{color:#221F3A;text-decoration:none}
@media (hover:hover) and (pointer:fine){a:hover{color:#5B5775}a.lk:hover{color:#2F56B0}}
button{font:inherit;cursor:pointer;color:inherit}
button,a,[role="button"]{touch-action:manipulation}
input,textarea,select{font-size:16px}
.pb,.qp,.chip,.grip,.swrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chips{overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.chips>*{scroll-snap-align:start}
.btn,.chip,.qp{transition:transform var(--t-fb) var(--ease)}
.btn:active,.chip:active{transform:scale(.97)}
.qp:active{transform:scale(.98)}
.pb{transition:box-shadow var(--t-fb) var(--ease)}
.pb:active{box-shadow:inset 0 0 0 100px rgba(34,31,58,.07)!important}
.rw{transition:background-color var(--t-fb) var(--ease)}
.rw:active{background-color:#EAF3EE!important}
.scr{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent)}
.lk{font:600 15px 'Figtree',system-ui,sans-serif;color:#263F8C;text-decoration:none;min-height:44px;min-width:44px;justify-content:center;display:inline-flex;align-items:center;gap:4px}
.num{font-variant-numeric:tabular-nums}
.qp{border-radius:22px;box-shadow:0 12px 28px -18px rgba(20,30,40,.4)}
body{font-variant-numeric:tabular-nums}
::selection{background:#C9F0DE;color:#221F3A}
a:focus-visible,button:focus-visible{outline:3px solid #2F56B0;outline-offset:3px}
.st{background-color:rgba(255,255,255,.78);border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 12px 28px -16px rgba(20,30,40,.32);transition:outline-color var(--t-state) var(--ease);outline:1.5px solid transparent;outline-offset:-7px}
.st.basted{outline:1.5px dashed rgba(34,31,58,.42)}
.chalk{position:relative;background:rgba(53,87,166,0.06);border-radius:22px;outline:2px dotted rgba(53,87,166,0.7);outline-offset:-3px}
@media (prefers-reduced-motion:reduce){.btn,.chip,.qp,.pb,.rw,.btn:active,.chip:active,.qp:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #EEF6F1; background-image: radial-gradient(75% 46% at 100% 0%, rgba(201,240,222,0.5) 0%, transparent 72%), radial-gradient(75% 46% at 0% 22%, rgba(221,235,255,0.5) 0%, transparent 72%), radial-gradient(75% 46% at 100% 60%, rgba(255,240,196,0.5) 0%, transparent 72%), radial-gradient(75% 46% at 0% 100%, rgba(207,239,240,0.5) 0%, transparent 72%); color: #221F3A; font-family: 'Figtree', system-ui, sans-serif;">
  <div class="scr" style="position: absolute; inset: 0 0 100px 0; overflow-y: auto; padding: 44px 16px 24px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px;"><a href="Build.dc.html" aria-label="Back to describe" style="width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#221F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><b style="font-size: 15px; font-weight: 600;">Preview</b><span style="width: 44px;"></span></div>
    <div style="display: flex; gap: 12px; align-items: center; font-size: 15px; font-weight: 500; color: #263F8C;"><svg class="sp" width="30" height="31" viewBox="-6 -10 68 70" aria-hidden="true" style="flex: none; overflow: visible;"><path d="M14 38 C8 40 5 43 0 45" fill="none" stroke="#221F3A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><rect x="10" y="6" width="36" height="8" rx="3" fill="#D9B98F" stroke="#221F3A" stroke-width="2.6"></rect><rect x="14" y="14" width="28" height="28" fill="#2F56B0" stroke="#221F3A" stroke-width="2.6"></rect><rect x="10" y="42" width="36" height="8" rx="3" fill="#D9B98F" stroke="#221F3A" stroke-width="2.6"></rect><circle cx="23" cy="26" r="3.2" fill="#FFFFFF"></circle><circle cx="33" cy="26" r="3.2" fill="#FFFFFF"></circle><path d="M20.5 21 q2.5 -2 5 0 M30.5 21 q2.5 -2 5 0" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M25 31.5 q3 2 6 0" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M41 9 L55 -5 L57 -7 L55 -3 Z" fill="#C9CCD1" stroke="#221F3A" stroke-width="1.2" stroke-linejoin="round"></path><path d="M54 -4 C60 -3 62 3 58 9" fill="none" stroke="#221F3A" stroke-width="1.5" stroke-linecap="round"></path></svg>Built 4 pieces. Here are 3 layouts.</div>
    <div class="st" role="group" aria-label="Layouts" style="display: flex; align-items: center; justify-content: space-between; padding: 4px;">
      <button type="button" onClick="{{ prev }}" aria-label="Previous layout" style="width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><b style="font-size: 15px;">{{ name }}</b><span style="display: flex; gap: 4px;"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="3"><i style="{{ d.style }}"></i></sc-for></span></span>
      <button type="button" onClick="{{ next }}" aria-label="Next layout" style="width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;"><span style="width: 36px; height: 36px; border-radius: 12px; background: #B1E5EE; display: grid; place-items: center; flex: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#221F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l3 3-3 3M4 12V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 12v3a3 3 0 0 1-3 3H4"></path></svg></span><h1 style="margin: 0; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.025em; line-height: 1.05;">Subscriptions</h1></div>
    <p style="margin: 0; font-size: 13px; color: #5B5775;">Example rows · cleared when you add it, unless you keep them</p>
    <sc-for list="{{ pieces }}" as="p" hint-placeholder-count="3">
      <section class="st" style="padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;">
        <span style="font-family: 'Figtree', system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0; color: #5B5775;">{{ p.k }}</span>
        <sc-if value="{{ p.isList }}" hint-placeholder-val="{{ true }}"><div><sc-for list="{{ subs }}" as="s" hint-placeholder-count="4"><div style="{{ s.style }}"><span style="flex: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; font-weight: 500; color: #221F3A;">{{ s.n }}</span><span style="font-size: 13px; color: #5B5775;">{{ s.w }}</span></span><span style="font-size: 13px; color: #5B5775; padding: 2px 8px; border-radius: 4px; box-shadow: inset 0 0 0 1px #B4B0CC;">example</span><span style="font-family: 'Figtree', system-ui, sans-serif; font-size: 14px;">{{ s.p }}</span></div></sc-for></div></sc-if>
        <sc-if value="{{ p.isTotal }}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.025em; font-variant-numeric: tabular-nums;">$38.46</span><span style="font-size: 13px; color: #5B5775;">a month · 4 subscriptions</span></div></sc-if>
        <sc-if value="{{ p.isCal }}" hint-placeholder-val="{{ false }}"><div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;"><sc-for list="{{ days }}" as="d" hint-placeholder-count="7"><span style="{{ d.style }}">{{ d.d }}<b>{{ d.n }}</b></span></sc-for></div></sc-if>
        <sc-if value="{{ p.isCap }}" hint-placeholder-val="{{ false }}"><div style="height: 8px; border-radius: 4px; background: #E3EFE8; overflow: hidden;"><div style="width: 96%; height: 100%; background: #1C6F52;"></div></div><span style="font-size: 13px; color: #5B5775;">$38.46 of $40 · 96%</span></sc-if>
      </section>
    </sc-for>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px;"><a class="btn" href="Arrange.dc.html" style="min-height: 48px; padding: 0 20px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: transparent; box-shadow: inset 0 0 0 1.5px #B4B0CC; color: #221F3A;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v6H4zM4 14h7v6H4zM15 14h5v6h-5z"></path></svg>Arrange</a><a class="btn" href="Connect.dc.html" style="min-height: 48px; padding: 0 20px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: #221F3A; color: #FFFFFF;">Use this layout</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    var self = this, st = this.state;
    var names = ['List first', 'Calendar first', 'Summary first'];
    var list = { k: 'Renewals', kind: 'list' }, total = { k: 'Monthly total', kind: 'total' }, cal = { k: 'Renewal dates', kind: 'cal' }, cap = { k: 'Under your $40 cap', kind: 'cap' };
    var orders = [[list, total, cal], [cal, list, total], [total, cap, list]];
    var pieces = orders[st.i].map(function (p) { return { k: p.k, isList: p.kind === 'list', isTotal: p.kind === 'total', isCal: p.kind === 'cal', isCap: p.kind === 'cap' }; });
    var subs = [['Spotify', 'renews Sun 22 Nov', '$11.99'], ['Hulu', 'not opened in 45 days', '$9.99'], ['Adobe CC, student', 'renews Thu 3 Dec', '$13.49'], ['iCloud 50 GB', 'renews Wed 9 Dec', '$2.99']].map(function (s, j) {
      return { n: s[0], w: s[1], p: s[2], style: 'display: flex; align-items: center; gap: 12px; min-height: 52px;' + (j ? ' background-image: linear-gradient(90deg, #B4B0CC 58%, transparent 0); background-size: 8px 1px; background-repeat: repeat-x;' : '') };
    });
    var days = [['F', '20'], ['S', '21'], ['S', '22'], ['M', '23'], ['T', '24'], ['W', '25'], ['T', '26']].map(function (d) { return { d: d[0], n: d[1], style: 'display: flex; flex-direction: column; align-items: center; padding: 8px 0; border-radius: 12px; font-size: 13px; font-variant-numeric: tabular-nums; ' + (d[1] === '22' ? 'background: #221F3A; color: #FFFFFF;' : 'background: #EAF3EE; color: #5B5775;') }; });
    return { name: names[st.i], pieces: pieces, subs: subs, days: days,
      dots: names.map(function (n, j) { return { style: 'width: 7px; height: 7px; border-radius: 50%; background: ' + (j === st.i ? '#221F3A' : '#B4B0CC') + ';' }; }),
      prev: function () { self.setState({ i: (st.i + 2) % 3 }); }, next: function () { self.setState({ i: (st.i + 1) % 3 }); } };
  }
}
</script>
</body>
</html>
