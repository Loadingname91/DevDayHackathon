<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#EEF6F1"><meta name="color-scheme" content="light">
<title>New app: arrange</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&amp;display=swap">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1);--ease-thread:cubic-bezier(.45,0,.15,1);--t-fb:120ms;--t-state:220ms;--t-layout:350ms;--t-focal:600ms;--t-state-out:140ms;--t-layout-out:220ms;--t-focal-out:360ms}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
body{margin:0}
a{color:#221F3A;text-decoration:none}
@media (hover:hover) and (pointer:fine){a:hover{color:#5B5775}a.lk:hover{color:#2F56B0}}
button{font:inherit;cursor:pointer;color:inherit}
button,a,[role="button"]{touch-action:manipulation}
input,textarea,select{font-size:16px}
.pb,.qp,.chip,.grip,.swrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chips{overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.chips>*{scroll-snap-align:start}
.btn,.chip,.qp{transition:transform var(--t-fb) var(--ease)}
.btn:active,.chip:active{transform:scale(.97)}
.qp:active{transform:scale(.98)}
.pb{transition:box-shadow var(--t-fb) var(--ease)}
.pb:active{box-shadow:inset 0 0 0 100px rgba(34,31,58,.07)!important}
.rw{transition:background-color var(--t-fb) var(--ease)}
.rw:active{background-color:#EAF3EE!important}
.scr{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent)}
.lk{font:600 15px 'Figtree',system-ui,sans-serif;color:#263F8C;text-decoration:none;min-height:44px;min-width:44px;justify-content:center;display:inline-flex;align-items:center;gap:4px}
.num{font-variant-numeric:tabular-nums}
.qp{border-radius:22px;box-shadow:0 12px 28px -18px rgba(20,30,40,.4)}
body{font-variant-numeric:tabular-nums}
::selection{background:#C9F0DE;color:#221F3A}
a:focus-visible,button:focus-visible{outline:3px solid #2F56B0;outline-offset:3px}
.st{background-color:rgba(255,255,255,.78);border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 12px 28px -16px rgba(20,30,40,.32);transition:outline-color var(--t-state) var(--ease);outline:1.5px solid transparent;outline-offset:-7px}
.st.basted{outline:1.5px dashed rgba(34,31,58,.42)}
.chalk{position:relative;background:rgba(53,87,166,0.06);border-radius:22px;outline:2px dotted rgba(53,87,166,0.7);outline-offset:-3px}
@media (prefers-reduced-motion:reduce){.btn,.chip,.qp,.pb,.rw,.btn:active,.chip:active,.qp:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #EEF6F1; background-image: radial-gradient(75% 46% at 100% 0%, rgba(201,240,222,0.5) 0%, transparent 72%), radial-gradient(75% 46% at 0% 22%, rgba(221,235,255,0.5) 0%, transparent 72%), radial-gradient(75% 46% at 100% 60%, rgba(255,240,196,0.5) 0%, transparent 72%), radial-gradient(75% 46% at 0% 100%, rgba(207,239,240,0.5) 0%, transparent 72%); color: #221F3A; font-family: 'Figtree', system-ui, sans-serif;">
  <div class="scr" style="position: absolute; inset: 0 0 20px 0; overflow-y: auto; padding: 44px 16px 24px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px;"><a href="Preview.dc.html" aria-label="Back to preview" style="width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#221F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><h1 style="margin: 0; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.005em;">Arrange</h1><a class="lk" href="Connect.dc.html" style="padding: 0 4px;">Done</a></div>
    <p style="margin: 0; font-size: 13px; color: #5B5775;">Drag the grip to reorder. The rows are examples.</p>
    <sc-for list="{{ pieces }}" as="p" hint-placeholder-count="4">
      <section class="st" style="padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="grip" aria-hidden="true" style="width: 44px; height: 44px; display: grid; place-items: center; color: #5B5775;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></span>
          <span style="flex: 1; display: flex; align-items: center; gap: 8px;"><span style="{{ p.mark }}"></span><b style="font-size: 16px;">{{ p.name }}</b></span>
          <button type="button" onClick="{{ p.rip }}" aria-label="Remove {{ p.name }}" style="width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l9-9M13 11l3-7 4 4-7 3M7 14l3 3"></path></svg></button>
        </div>
        <sc-if value="{{ p.isList }}" hint-placeholder-val="{{ false }}"><div role="group" aria-label="View type" style="display: inline-flex; align-self: flex-start; margin-left: 50px; border-radius: 16px; box-shadow: inset 0 0 0 1.5px #B4B0CC; overflow: hidden;"><sc-for list="{{ views }}" as="v" hint-placeholder-count="3"><button type="button" onClick="{{ v.pick }}" aria-pressed="{{ v.on }}" style="{{ v.style }}">{{ v.label }}</button></sc-for></div></sc-if>
        <span style="margin-left: 50px; font-size: 13px; color: #5B5775;">{{ p.desc }}</span>
      </section>
    </sc-for>
    <sc-if value="{{ ripped }}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 16px; background: #221F3A; color: #F6FAF8; font-size: 15px;">Removed a piece.<button type="button" onClick="{{ undo }}" style="margin-left: auto; min-height: 44px; padding: 0 12px; border-radius: 16px; border: 1.5px solid rgba(251,246,236,0.5); background: transparent; color: #F6FAF8; font-weight: 600;">Undo</button></div></sc-if>
    <button class="btn" type="button" style="min-height: 48px; padding: 0 20px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: transparent; box-shadow: inset 0 0 0 1.5px #B4B0CC; color: #221F3A;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a block</button>
    <div class="chalk" style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px;"><span style="flex: 1; font-size: 15px; font-weight: 500; color: #263F8C;">Tell Clair: put the total on top</span><span style="width: 44px; height: 44px; border-radius: 16px; background: #221F3A; color: #FFFFFF; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { gone: {}, view: 'list' }; }
  renderVals() {
    var self = this, st = this.state;
    var mk = function (c) { return 'width: 18px; height: 18px; border-radius: 4px; background: ' + c + '; box-shadow: inset 0 0 0 1.3px #221F3A;'; };
    var all = [['Renewals', '#221F3A', 'Spotify, Hulu, Adobe, iCloud', true], ['Monthly total', '#B5EBD0', '$38.46 a month', false], ['Renewal dates', '#BDD5FF', 'Sun 22: Spotify', false], ['Add a subscription', '#BDD5FF', 'name, price, renews on', false]];
    var pieces = all.filter(function (p, i) { return !st.gone[i]; }).map(function (p) {
      var i = all.indexOf(p);
      return { name: p[0], mark: mk(p[1]), desc: p[0] === 'Renewals' ? 'Shown as ' + st.view + ' · ' + p[2] : p[2], isList: p[3],
        rip: function () { var g = Object.assign({}, st.gone); g[i] = true; self.setState({ gone: g, last: i }); } };
    });
    var views = ['list', 'table', 'calendar'].map(function (v) {
      var on = st.view === v;
      return { label: v.charAt(0).toUpperCase() + v.slice(1), on: on ? 'true' : 'false', pick: function () { self.setState({ view: v }); }, style: 'min-height: 44px; min-width: 52px; padding: 0 12px; border: 0; font-size: 13px; ' + (on ? 'background: #221F3A; color: #F6FAF8;' : 'background: transparent; color: #5B5775;') };
    });
    return { pieces: pieces, views: views, ripped: st.last !== undefined && st.gone[st.last],
      undo: function () { var g = Object.assign({}, st.gone); delete g[st.last]; self.setState({ gone: g, last: undefined }); } };
  }
}
</script>
</body>
</html>
