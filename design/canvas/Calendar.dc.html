<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#EEF6F1"><meta name="color-scheme" content="light">
<title>Calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&amp;display=swap">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1);--ease-thread:cubic-bezier(.45,0,.15,1);--t-fb:120ms;--t-state:220ms;--t-layout:350ms;--t-focal:600ms;--t-state-out:140ms;--t-layout-out:220ms;--t-focal-out:360ms}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
body{margin:0}
a{color:#221F3A;text-decoration:none}
@media (hover:hover) and (pointer:fine){a:hover{color:#5B5775}a.lk:hover{color:#2F56B0}}
button{font:inherit;cursor:pointer;color:inherit}
button,a,[role="button"]{touch-action:manipulation}
input,textarea,select{font-size:16px}
.pb,.qp,.chip,.grip,.swrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chips{overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.chips>*{scroll-snap-align:start}
.btn,.chip,.qp{transition:transform var(--t-fb) var(--ease)}
.btn:active,.chip:active{transform:scale(.97)}
.qp:active{transform:scale(.98)}
.pb{transition:box-shadow var(--t-fb) var(--ease)}
.pb:active{box-shadow:inset 0 0 0 100px rgba(34,31,58,.07)!important}
.rw{transition:background-color var(--t-fb) var(--ease)}
.rw:active{background-color:#EAF3EE!important}
.scr{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent)}
.lk{font:600 15px 'Figtree',system-ui,sans-serif;color:#263F8C;text-decoration:none;min-height:44px;min-width:44px;justify-content:center;display:inline-flex;align-items:center;gap:4px}
.num{font-variant-numeric:tabular-nums}
.qp{border-radius:22px;box-shadow:0 12px 28px -18px rgba(20,30,40,.4)}
body{font-variant-numeric:tabular-nums}
::selection{background:#C9F0DE;color:#221F3A}
a:focus-visible,button:focus-visible{outline:3px solid #2F56B0;outline-offset:3px}
.st{background-color:rgba(255,255,255,.78);border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 12px 28px -16px rgba(20,30,40,.32);transition:outline-color var(--t-state) var(--ease);outline:1.5px solid transparent;outline-offset:-7px}
.st.basted{outline:1.5px dashed rgba(34,31,58,.42)}
.chalk{position:relative;background:rgba(53,87,166,0.06);border-radius:22px;outline:2px dotted rgba(53,87,166,0.7);outline-offset:-3px}
@media (prefers-reduced-motion:reduce){.btn,.chip,.qp,.pb,.rw,.btn:active,.chip:active,.qp:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #EEF6F1; background-image: radial-gradient(75% 46% at 100% 0%, rgba(201,240,222,0.5) 0%, transparent 72%), radial-gradient(75% 46% at 0% 22%, rgba(221,235,255,0.5) 0%, transparent 72%), radial-gradient(75% 46% at 100% 60%, rgba(255,240,196,0.5) 0%, transparent 72%), radial-gradient(75% 46% at 0% 100%, rgba(207,239,240,0.5) 0%, transparent 72%); color: #221F3A; font-family: 'Figtree', system-ui, sans-serif;">
  <div class="scr" style="position: absolute; inset: 0 0 96px 0; overflow-y: auto; padding: 44px 16px 24px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 16px;">
    <a href="Main.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#221F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;"><span style="width: 36px; height: 36px; border-radius: 12px; background: #BDD5FF; display: grid; place-items: center; flex: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#221F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"></path></svg></span><h1 style="margin: 0; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.025em; line-height: 1.05;">This week</h1></div>
    <p style="margin: 0; font-size: 15px;">Dates from every app, in one place.</p>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
      <sc-for list="{{ week }}" as="d" hint-placeholder-count="7">
        <span style="{{ d.cell }}"><span style="font-size: 13px;">{{ d.dow }}</span><b style="font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; font-variant-numeric: tabular-nums;">{{ d.num }}</b><span style="font-size: 13px; min-height: 12px;">{{ d.dots }}</span></span>
      </sc-for>
    </div>
    <sc-for list="{{ days }}" as="day" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; gap: 8px; font-family: 'Figtree', system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0; color: #5B5775;"><span>{{ day.label }}</span></div>
        <section class="st" style="padding: 4px 16px;">
          <sc-for list="{{ day.items }}" as="e" hint-placeholder-count="2">
            <a class="rw" href="{{ e.href }}" style="{{ e.row }}">
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
                <span style="display: flex; align-items: center; flex-wrap: wrap; column-gap: 8px; row-gap: 2px; font-size: 16px; font-weight: 500; color: #221F3A;">{{ e.title }}<sc-if value="{{ e.changed }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 600; padding: 2px 8px; background: #221F3A; color: #FFFFFF; border-radius: 99px; white-space: nowrap;">just changed</span></sc-if></span>
                <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5B5775;"><span aria-hidden="true" style="{{ e.dot }}"></span><span>From {{ e.app }}</span></span>
              </span>
              <span style="font-family: 'Figtree', sans-serif; font-weight: 600; font-size: 13px; color: #5B5775; white-space: nowrap; font-variant-numeric: tabular-nums;">{{ e.time }}</span>
            </a>
          </sc-for>
        </section>
      </div>
    </sc-for>
  </div>
  <nav aria-label="Pinned apps and Clair" style="position: absolute; left: 12px; right: 12px; bottom: max(18px, env(safe-area-inset-bottom, 0px)); height: 64px; display: flex; padding-block: 5px; padding-inline: 6px; box-sizing: border-box; border-radius: 26px; background: rgba(255,255,255,0.74); border: 1px solid rgba(255,255,255,0.95); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: 0 14px 30px -12px rgba(20,30,40,0.4);">
    <a class="pb" href="Budget.dc.html" aria-label="Budget" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 20px;"><span aria-hidden="true" style="position: relative; overflow: hidden; width: 46px; height: 30px; border-radius: 13px; display: grid; place-items: center; background: #B5EBD0; color: #1C6F52;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v12H3zM3 10h18M16 15h2"></path></svg></span><span style="font-size: 13px; font-weight: 600; line-height: 16px; letter-spacing: 0; white-space: nowrap;">Budget</span></a>
    <a class="pb" href="Groceries.dc.html" aria-label="Groceries" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 20px;"><span aria-hidden="true" style="position: relative; overflow: hidden; width: 46px; height: 30px; border-radius: 13px; display: grid; place-items: center; background: #FFC8AC; color: #A8481B;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 10.5h10.6L20 7H6.2M9 19.5h.01M17 19.5h.01"></path></svg></span><span style="font-size: 13px; font-weight: 600; line-height: 16px; letter-spacing: 0; white-space: nowrap;">Groceries</span></a>
    <a class="pb" href="Calendar.dc.html" aria-label="Calendar" aria-current="page" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 20px;"><span aria-hidden="true" style="position: relative; overflow: hidden; width: 46px; height: 30px; border-radius: 13px; display: grid; place-items: center; background: #BDD5FF; color: #2B58B8; box-shadow: inset 0 0 0 2px #221F3A;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"></path></svg></span><span style="font-size: 13px; font-weight: 600; line-height: 16px; letter-spacing: 0; white-space: nowrap; font-weight: 700;">Calendar</span></a>
    <a class="pb" href="Todos.dc.html" aria-label="To-dos" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 20px;"><span aria-hidden="true" style="position: relative; overflow: hidden; width: 46px; height: 30px; border-radius: 13px; display: grid; place-items: center; background: #FFE48F; color: #7D5B00;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span><span style="font-size: 13px; font-weight: 600; line-height: 16px; letter-spacing: 0; white-space: nowrap;">To-dos</span></a>
    <a class="pb" role="button" href="ClairSheet.dc.html" aria-label="Clair: type, talk or add a photo. Hold to talk" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 20px;"><span aria-hidden="true" style="position: relative; overflow: hidden; width: 46px; height: 30px; border-radius: 13px; display: grid; place-items: center; background: #221F3A;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v3.5H5zM5 17.5h14V21H5zM7.5 6.5v11M16.5 6.5v11M7.5 11l9-2M7.5 15l9-2M7.5 15.5C4.8 16 3.2 18 2.2 21.5"></path></svg></span><span style="font-size: 13px; font-weight: 600; line-height: 16px; letter-spacing: 0; white-space: nowrap; font-weight: 700;">Clair</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var D = { Workout: ['#FFBFD4', 'Workout.dc.html'], Groceries: ['#FFC8AC', 'Groceries.dc.html'], 'To-dos': ['#FFE48F', 'Todos.dc.html'], Subscriptions: ['#B1E5EE', 'Budget.dc.html'], Classes: ['#CFC3FF', 'Preview.dc.html'], Budget: ['#B5EBD0', 'Budget.dc.html'] };
    var ev = function (title, app, time, changed) { return { title: title, app: app, time: time, changed: !!changed, href: D[app][1], dot: 'flex: none; width: 10px; height: 10px; border-radius: 50%; background: ' + D[app][0] + '; box-shadow: inset 0 0 0 1.5px rgba(34,31,58,0.45);' }; };
    var days = [
      { label: 'Today · Fri 20 Nov', items: [ev('Grocery trip, Corner Market', 'Groceries', '5:41\u00a0pm', true), ev('Pull day', 'Workout', '6\u00a0pm'), ev('Return library books', 'To-dos', '9\u00a0pm')] },
      { label: 'Sun 22 Nov', items: [ev('Spotify renews · $11.99', 'Subscriptions', '')] },
      { label: 'Tue 24 Nov', items: [ev('Use the chicken and spinach', 'Groceries', '', true)] },
      { label: 'Mon 23 Nov', items: [ev('CS 3500 project due', 'Classes', '11:59\u00a0pm')] }
    ];
    days = [days[0], days[1], days[3], days[2]];
    days.forEach(function (d) { d.items.forEach(function (e, i) { e.row = 'display: flex; align-items: center; gap: 12px; min-height: 58px;' + (i ? ' background-image: linear-gradient(90deg, #B4B0CC 58%, transparent 0); background-size: 8px 1px; background-repeat: repeat-x;' : ''); }); });
    var counts = [3, 0, 1, 1, 1, 0, 0];
    var week = ['F', 'S', 'S', 'M', 'T', 'W', 'T'].map(function (w, i) {
      return { dow: w, num: String(20 + i), dots: counts[i] ? new Array(counts[i] + 1).join('•') : '', cell: 'display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 12px; ' + (i === 0 ? 'background: #221F3A; color: #FFFFFF;' : 'background: #FFFFFF; color: #221F3A; box-shadow: inset 0 0 0 1px #E6DCC8;') };
    });
    return { days: days, week: week };
  }
}
</script>
</body>
</html>
