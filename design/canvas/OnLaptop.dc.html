<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F4EEE1"><meta name="color-scheme" content="light">
<title>Join from a laptop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=DM+Mono:wght@400;500&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1);--ease-thread:cubic-bezier(.45,0,.15,1);--t-fb:120ms;--t-state:220ms;--t-layout:350ms;--t-focal:600ms;--t-state-out:140ms;--t-layout-out:220ms;--t-focal-out:360ms}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
body{margin:0}
a{color:#2A2119;text-decoration:none}
@media (hover:hover) and (pointer:fine){a:hover{color:#665847}a.lk:hover{color:#3557A6}}
button{font:inherit;cursor:pointer;color:inherit}
button,a,[role="button"]{touch-action:manipulation}
input,textarea,select{font-size:16px}
.pb,.qp,.chip,.grip,.swrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chips{overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.chips>*{scroll-snap-align:start}
.btn,.chip,.qp{transition:transform var(--t-fb) var(--ease)}
.btn:active,.chip:active{transform:scale(.97)}
.qp:active{transform:scale(.98)}
.pb{transition:box-shadow var(--t-fb) var(--ease)}
.pb:active{box-shadow:inset 0 0 0 100px rgba(42,33,25,.07)!important}
.rw{transition:background-color var(--t-fb) var(--ease)}
.rw:active{background-color:#F7F1E6!important}
.scr{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent)}
.lk{font:600 15px 'Hanken Grotesk',system-ui,sans-serif;color:#22396F;text-decoration:none;min-height:44px;min-width:44px;justify-content:center;display:inline-flex;align-items:center;gap:4px}
.num{font-variant-numeric:tabular-nums}
.st{background-color:#FFFDF8;border-radius:16px;background-image:linear-gradient(90deg,#BFAE90 58%,transparent 0),linear-gradient(90deg,#BFAE90 58%,transparent 0),linear-gradient(0deg,#BFAE90 58%,transparent 0),linear-gradient(0deg,#BFAE90 58%,transparent 0);background-size:7px 1.5px,7px 1.5px,1.5px 7px,1.5px 7px;background-position:0 5px,0 calc(100% - 5px),5px 0,calc(100% - 5px) 0;background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;transition:background-size var(--t-state) var(--ease)}
.st.basted{background-image:linear-gradient(90deg,#665847 62%,transparent 0),linear-gradient(90deg,#665847 62%,transparent 0),linear-gradient(0deg,#665847 62%,transparent 0),linear-gradient(0deg,#665847 62%,transparent 0);background-size:20px 1.5px,20px 1.5px,1.5px 20px,1.5px 20px;transition-duration:var(--t-state-out)}
.chalk{position:relative;background:rgba(53,87,166,0.06);border-radius:16px;outline:2px dotted rgba(53,87,166,0.7);outline-offset:-3px}
@media (prefers-reduced-motion:reduce){.btn,.chip,.qp,.pb,.rw,.st{transition:none}.btn:active,.chip:active,.qp:active{transform:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #F4EEE1; color: #2A2119; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: grid; grid-template-columns: minmax(0, 1fr) 480px minmax(0, 1fr);">
  <span style="position: absolute; top: 28px; left: 32px; display: flex; gap: 8px; align-items: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.005em;"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="9" height="9" rx="2" fill="#E3A72F"></rect><rect x="12" y="1" width="9" height="9" rx="2" fill="#5B7DB1"></rect><rect x="1" y="12" width="9" height="9" rx="2" fill="#8DB580"></rect><rect x="12" y="12" width="9" height="9" rx="2" fill="#9C6BA8"></rect></svg>quilt</span>
  <main style="grid-column: 2; align-self: center; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; align-items: center; gap: 16px;"><sc-if value="{{ notJoined }}" hint-placeholder-val="{{ true }}"><svg class="sp" width="96" height="99" viewBox="-6 -10 68 70" aria-hidden="true" style="flex: none; overflow: visible;"><path d="M14 38 C8 40 5 43 0 45" fill="none" stroke="#2A2119" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path><rect x="10" y="6" width="36" height="8" rx="3" fill="#D9B98F" stroke="#2A2119" stroke-width="1.6"></rect><rect x="14" y="14" width="28" height="28" fill="#3557A6" stroke="#2A2119" stroke-width="1.6"></rect><path d="M14 18.5h28M14 38h28" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="1.4"></path><rect x="10" y="42" width="36" height="8" rx="3" fill="#D9B98F" stroke="#2A2119" stroke-width="1.6"></rect><circle cx="23" cy="26" r="2.3" fill="#FFFFFF"></circle><circle cx="33" cy="26" r="2.3" fill="#FFFFFF"></circle><path d="M24 31 q4 3 8 0" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if><sc-if value="{{ joined }}" hint-placeholder-val="{{ false }}"><svg class="sp" width="96" height="99" viewBox="-6 -10 68 70" aria-hidden="true" style="flex: none; overflow: visible;"><path d="M14 38 C8 40 5 43 0 45" fill="none" stroke="#2A2119" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path><rect x="10" y="6" width="36" height="8" rx="3" fill="#D9B98F" stroke="#2A2119" stroke-width="1.6"></rect><rect x="14" y="14" width="28" height="28" fill="#3557A6" stroke="#2A2119" stroke-width="1.6"></rect><path d="M14 18.5h28M14 38h28" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="1.4"></path><rect x="10" y="42" width="36" height="8" rx="3" fill="#D9B98F" stroke="#2A2119" stroke-width="1.6"></rect><path d="M20.5 27 q2.5 -3.5 5 0 M30.5 27 q2.5 -3.5 5 0" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path><path d="M23.5 30.5 q4.5 4.5 9 0" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if><h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.025em; line-height: 1.1;">{{ head }}</h1></div>
    <sc-if value="{{ notJoined }}" hint-placeholder-val="{{ true }}"><section class="st" style="padding: 24px; display: flex; flex-direction: column; gap: 16px;"><label for="jc" style="font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0; color: #665847;">Enter a code from your phone</label><div style="position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;"><sc-for list="{{ boxes }}" as="b" hint-placeholder-count="6"><span aria-hidden="true" style="{{ b.style }}">{{ b.d }}</span></sc-for><input id="jc" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="{{ code }}" onInput="{{ typed }}" style="position: absolute; inset: 0; width: 100%; opacity: 0; border: 0; font-size: 16px; cursor: text;"></div><span aria-live="polite" style="{{ msgStyle }}">{{ msg }}</span></section></sc-if>
    <sc-if value="{{ joined }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 17px; line-height: 1.45;">The laptop's own empty guest quilt is gone. Everything you add here shows on your phone too.</p><div style="display: flex;"><a class="btn" href="Laptop.dc.html" style="min-height: 48px; padding: 0 20px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; border: 0; background: #3557A6; color: #FFFFFF;">Open my quilt</a></div></sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { code: '', bad: false, joined: false }; }
  renderVals() {
    var self = this, st = this.state;
    var boxes = [0, 1, 2, 3, 4, 5].map(function (i) { var d = st.code[i] || '', next = i === st.code.length;
      return { d: d, style: 'height: 64px; border-radius: 12px; background: #FFFDF8; display: grid; place-items: center; font-family: \'DM Mono\', monospace; font-size: 28px; ' + (next ? 'box-shadow: inset 0 0 0 2px #3557A6;' : 'box-shadow: inset 0 0 0 1.5px #BFAE90;') }; });
    return { boxes: boxes, code: st.code, joined: st.joined, notJoined: !st.joined,
      head: st.joined ? 'Joined. Same quilt as your phone.' : "Hi. I'm Clair. I keep track of the stuff that slips.",
      msg: st.bad ? "That code didn't work. Get a new one on your phone." : 'On your phone: Settings, then Add a device.',
      msgStyle: 'font-size: 15px; ' + (st.bad ? 'font-weight: 600; color: #2A2119;' : 'color: #665847;'),
      typed: function (e) { var v = e.target.value.replace(/\D/g, '').slice(0, 6);
        if (v.length < 6) return self.setState({ code: v, bad: false });
        if (v === '482913') self.setState({ code: v, joined: true }); else self.setState({ code: '', bad: true }); } };
  }
}
</script>
</body>
</html>
